name: temporary docs changelog refresh
on:
  push:
    branches: [ docs/refresh-main-20260914 ]
    paths: [ .github/workflows/_temp_docs_changelog_refresh.yml ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/refresh-main-20260914
      - name: Refresh current-main changelog only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          start = s.index('## Unreleased / main')
          end = s.index('## v2.2.1', start)
          replacement = '''## Unreleased / main (2026-09-14)\n\n### Launcher 4.50 integration\n\n- 新增 Launcher 4.50 图标大小缩放事务，覆盖 Workspace、Dock、小文件夹 preview、打开文件夹内容与 Workstation App 页，并避免普通 All Apps/Search 被共享 `GridConfig` 误缩放\n- Workspace 拖拽玻璃迁移为独立上层窗口 + 实时 Workspace PassBlur + MIUI DragView direct-draw mirror；DragView 继续保持 drag/drop 与移动几何权威\n- 新增长按桌面图标的 ShortcutMenu 专用 glass session，并增加独立深色模式适配；文字变白，独立图标只对白色化前判定为近黑/低色差的线条图标应用 tint，彩色第三方图标保持原样\n- 新增仅 Dock 系统功能入口的 icon glass gate，可与普通 icon glass 分开使用\n\n### R8 / reflection hardening\n\n- 移除 Launcher glass 路径对 LiquidDock 自有私有成员的字符串 self-reflection，改为 typed package-private API\n- 修复 API101/307 Dock spacing 在 R8 后将跨 Launcher ClassLoader 的 `RecyclerView$State` 字符串改写为模块混淆名的问题；使用 targeted `-keepnames`，不扩大为整包 keep\n- Debug 与 Release 均继续经过 R8 optimization，用 debug CI 提前捕获 shrinker regression\n\n### Security Center semantic compatibility\n\n- Security Center glass 从固定 versionCode/混淆成员映射迁移为 capability-driven semantic contract：通过类关系、方法签名、公开语义 getter、资源能力和唯一结构关系解析兼容性\n- `com.miui.securitycenter:ui` 仍是唯一安装进程；能力缺失或歧义时 fail closed，并仅输出一次 unsupported 提示\n- 当前 coordinator 覆盖 Game、Video、Global Dock 与 All Apps carrier；root/session identity 与 material/carrier epoch 分离\n- 新增/强化 `SecurityCenterPassBlurContinuousAuthority` 与 `SecurityCenterVendorMaterialState`：保持 LiquidDock PassBlur output/scale 权威，记录并抑制被 claim carrier 的 vendor material writes，release 时重放最后观察到的 vendor state\n\n### Workspace source / quality correctness\n\n- Workspace HOME shared PassBlur 保持 source-driven continuous update permission；静态 source 可自然无新 buffer，动态 source 持续更新，不创建固定 capture timer/vsync pump\n- native PassBlur spatial scale 与 local physical FBO quality scaling 分离；render FPS gate 不阻塞 OES drain，fresh generation 可越过普通限流\n\n### Documentation\n\n- 根文档按 2.4.1 当前生产代码重建，删除固定 Security Center build/混淆字段等过时说明，并补齐 R8、live drag、shortcut popup、图标缩放、Widget/功能 Dock 图标等当前行为\n\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m 'docs: refresh current-main changelog'
          git push origin HEAD:docs/refresh-main-20260914
