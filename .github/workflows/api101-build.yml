name: API102 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: api102-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # PR caches are isolated to refs/pull/*/merge, so let repeated pushes
          # to the same PR reuse branch-specific Gradle/build-cache state.
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
          # The default on-success cleanup starts an extra Gradle invocation and
          # costs ~20-30s on this project. Cache keys are immutable and the repo
          # is small enough that retaining prior entries is preferable here.
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
          if (( ${#files[@]} > 0 )) && grep -En '(^|[^A-Za-z0-9_])(ob|ja)\.[A-Za-z_$]|com\.miui\.dock\.sidebar\.[a-z](["$;.)]|$)|startsWith\("com\.miui\.dock\.sidebar\."' "${files[@]}"; then
            echo "Forbidden Security Center obfuscated-name dependency detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      # PR-only A/B experiment: build the optimized Release variant, but sign it
      # with the SAME public debug key as assembleDebug. The resulting two APKs
      # differ by build type/R8, not by signing identity.
      - name: Assemble optimized Release and verify Xposed entry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace
          APK=$(find build/outputs/apk/release -name '*-unsigned.apk' -print -quit)
          test -n "$APK"
          ENTRY=$(unzip -p "$APK" META-INF/xposed/java_init.list)
          echo "Release Xposed entry: $ENTRY"
          test "$ENTRY" = "com.hellovoid.liquiddock.ModuleMain"
          for variant in debug release; do
            MAP="build/outputs/mapping/$variant/mapping.txt"
            test -f "$MAP"
            echo "$variant mapping:"
            grep -F 'com.hellovoid.liquiddock.ModuleMain -> com.hellovoid.liquiddock.ModuleMain:' "$MAP"
          done
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 "$APK" build/outputs/apk/release/LiquidDock-release-aligned.apk
          "$TOOLS/apksigner" sign \
            --ks signing/hellovoid-debug.keystore \
            --ks-key-alias hellovoid-debug \
            --ks-pass pass:hellovoid-debug \
            --key-pass pass:hellovoid-debug \
            --out build/outputs/apk/release/LiquidDock-release-debug-signed.apk \
            build/outputs/apk/release/LiquidDock-release-aligned.apk
          "$TOOLS/apksigner" verify --verbose build/outputs/apk/release/LiquidDock-release-debug-signed.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: LiquidDock-release-debug-key-r8-test
          path: build/outputs/apk/release/LiquidDock-release-debug-signed.apk
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: LiquidDock-r8-mapping
          path: |
            build/outputs/mapping/debug/mapping.txt
            build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api102-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-build-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
