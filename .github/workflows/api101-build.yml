name: Dock latency probe C2 normalization-only

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dock-latency-c2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Apply C2 normalization-only render probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java')
          s = p.read_text()
          old = '''            ensureFboSizeExact(mapping.sampleWidth, mapping.sampleHeight);\n            renderNormalizationPass(mapping);\n            PrismalGeometry prismalGeometry = createPrismalGeometry(mapping);\n            prismalRenderer.prepareBackdrop(\n                    rawTexture, mapping.sampleWidth, mapping.sampleHeight, mapping.prismalParams);\n            DockGlassSceneSnapshot dockScene = dockCompositor.latestScene();\n            dockCompositor.drawFrame(prismalRenderer, prismalGeometry, mapping.prismalParams,\n                    dockBodyHighlightProfile, dockScene,\n                    mapping.sampleWidth, mapping.sampleHeight);\n            int prismalTexture = prismalRenderer.outputTexture();\n            if (!renderCompositePass(prismalTexture, mapping)) return;'''
          new = '''            // C2 latency probe: retain the exact producer normalization + overscan FBO and\n            // final crop/composite, but bypass Prismal blur/refraction/highlight entirely.\n            ensureFboSizeExact(mapping.sampleWidth, mapping.sampleHeight);\n            renderNormalizationPass(mapping);\n            PrismalGeometry prismalGeometry = createPrismalGeometry(mapping);\n            if (!renderCompositePass(rawTexture, mapping)) return;'''
          if s.count(old) != 1:
              raise SystemExit(f'C2 render block match count={s.count(old)}')
          s = s.replace(old, new, 1)
          s = s.replace('material=prismal-module-official', 'material=latency-probe-normalization-only', 1)
          s = s.replace('blur=official-two-pass-0.5x', 'blur=disabled', 1)
          p.write_text(s)
          PY
          grep -nE 'C2 latency probe|latency-probe-normalization-only|renderCompositePass\(rawTexture' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java
      - name: Verify probe excludes Prismal draw path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java').read_text()
          start = s.index('private void drawLatestFrame')
          end = s.index('private void maybeLogPowerStats', start)
          body = s[start:end]
          forbidden = ['prismalRenderer.prepareBackdrop(', 'dockCompositor.drawFrame(']
          bad = [x for x in forbidden if x in body]
          if bad:
              raise SystemExit('C2 still executes Prismal path: ' + ', '.join(bad))
          if 'renderCompositePass(rawTexture, mapping)' not in body:
              raise SystemExit('C2 rawTexture composite missing')
          print('C2 render-path audit OK')
          PY
      - name: Mark production Prismal contracts N/A for probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              (Path('src/test/java/com/hellovoid/liquiddock/DockGlassShapeOwnershipContractTest.java'),
               'public void dockBodyUsesConfiguredLargeSurfaceHighlightProfile()'),
              (Path('src/test/java/com/hellovoid/liquiddock/PrismalModuleBoundaryContractTest.java'),
               'public void liquidDockAdapterOwnsOesNormalizationMappingLogAndFinalCrop()'),
          ]
          for p, sig in targets:
              s = p.read_text()
              if 'import org.junit.Ignore;' not in s:
                  s = s.replace('import org.junit.Test;\n', 'import org.junit.Ignore;\nimport org.junit.Test;\n', 1)
              needle = '    @Test\n    ' + sig
              repl = '    @Ignore("latency probe intentionally bypasses production Prismal path")\n    @Test\n    ' + sig
              if needle not in s:
                  raise SystemExit(f'probe ignore marker missing: {p.name} {sig}')
              s = s.replace(needle, repl, 1)
              p.write_text(s)
          PY
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expC2-normalization-only-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expC2-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
