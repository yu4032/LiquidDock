name: Temporary SideSlideHold diagnostic patch
on:
  push:
    branches: [ feat/launcher450-side-slide-hold ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/launcher450-side-slide-hold
      - name: Route experimental logs to unconditional logcat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'src/main/java/com/hellovoid/liquiddock/Launcher450SideSlideHoldHook.java',
              'src/main/java/com/hellovoid/liquiddock/SecurityCenterSidebarCommandBridge.java',
          ]:
              p = Path(name)
              s = p.read_text()
              s2 = s.replace('MainHook.log(', 'SideSlideHoldDiagnostics.log(')
              if s2 == s:
                  raise SystemExit(f'no MainHook.log replacement in {name}')
              p.write_text(s2)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-side-slide-diag-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/Launcher450SideSlideHoldHook.java src/main/java/com/hellovoid/liquiddock/SecurityCenterSidebarCommandBridge.java .github/workflows/tmp-side-slide-diag-patch.yml
          git commit -m 'debug: make side-slide runtime logs unconditional'
          git push origin HEAD:feat/launcher450-side-slide-hold
