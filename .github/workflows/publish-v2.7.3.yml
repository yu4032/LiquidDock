name: Publish verified signed LiquidDock v2.7.3
on:
  push:
    branches: [release/publish-v2.7.3]
    paths:
      - '.github/workflows/publish-v2.7.3.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release source for notes
        uses: actions/checkout@v4
        with:
          ref: 543bfd411cf024c24793688f6014c6598827b369
          persist-credentials: false

      - name: Download signed artifact and verify provenance
        shell: bash
        env:
          SIGNED_ARTIFACT_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-84e8-81f8-b3c3-36b3a40aae7d/raw?se=2026-10-17T16%3A21%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=318e120e-ff7d-5fbb-9459-e1dc69827bb0&skoid=6174e06a-818a-4ff5-b6f0-d683c3377d0a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T20%3A46%3A05Z&ske=2026-10-17T20%3A46%3A05Z&sks=b&skv=2026-02-06&sig=KTQin/Rv8yXDPD1Q3J0OUGQbXCN4fOSf%2BaNUUC/0uT4%3D"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$SIGNED_ARTIFACT_URL" -o signed-release.zip
          printf '%s  %s\n' 'cb4bbfba41b76be06ec712721f97e6ed0c32277824ad819c6c2f7680cd2b4ae2' signed-release.zip | sha256sum --check -
          mkdir -p verified
          unzip -q signed-release.zip -d verified
          test -f verified/LiquidDock-release.apk
          grep -Fx 'LiquidDock source commit: 543bfd411cf024c24793688f6014c6598827b369' verified/LiquidDock-release-provenance.txt
          grep -Fx 'Signed APK SHA-256: 9fa3f28a91f4942fb2c375e88dbe0ec455f16f33d1e7b84b3e43911aa13da590' verified/LiquidDock-release-provenance.txt
          grep -Fx 'Signer certificate SHA-256: 01AD0A5948A67E10820F357E1D67C88704FD672E9135AA10D8F2EE2A4B20C641' verified/LiquidDock-release-provenance.txt
          test "$(sha256sum verified/LiquidDock-release.apk | cut -d ' ' -f1)" = '9fa3f28a91f4942fb2c375e88dbe0ec455f16f33d1e7b84b3e43911aa13da590'
          test "$(tr -d '\r\n' < verified/LiquidDock-signer-sha256.txt)" = '01AD0A5948A67E10820F357E1D67C88704FD672E9135AA10D8F2EE2A4B20C641'
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          signer_output="$("$apksigner" verify --verbose --print-certs verified/LiquidDock-release.apk)"
          printf '%s\n' "$signer_output"
          actual_cert="$(printf '%s\n' "$signer_output" | awk 'BEGIN { IGNORECASE=1 } /certificate.*SHA.*256.*digest/ { print $NF; exit }' | tr -d ':[:space:]')"
          test "${actual_cert^^}" = '01AD0A5948A67E10820F357E1D67C88704FD672E9135AA10D8F2EE2A4B20C641'
          mv verified/LiquidDock-release.apk verified/LiquidDock-release-v2.7.3.apk
          printf '%s  %s\n' '9fa3f28a91f4942fb2c375e88dbe0ec455f16f33d1e7b84b3e43911aa13da590' LiquidDock-release-v2.7.3.apk > verified/LiquidDock-release-v2.7.3.apk.sha256

      - name: Publish GitHub Release with verified signed APK
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: yu4032/LiquidDock
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.7.3 >/dev/null 2>&1; then
            echo 'Release v2.7.3 already exists; refusing to overwrite or duplicate.'
            exit 1
          fi
          gh release create v2.7.3 \
            'verified/LiquidDock-release-v2.7.3.apk' \
            'verified/LiquidDock-release-provenance.txt' \
            'verified/LiquidDock-release-v2.7.3.apk.sha256' \
            --target '543bfd411cf024c24793688f6014c6598827b369' \
            --title 'LiquidDock v2.7.3' \
            --notes-file docs/release-notes-v2.7.3.md \
            --latest
