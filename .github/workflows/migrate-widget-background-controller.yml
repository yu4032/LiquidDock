name: Migrate Widget Background Controller
on:
  push:
    branches: [feat/widget-dark-content-adaptation]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/widget-dark-content-adaptation
      - name: Migrate static glass widget call sites
        run: python3 scripts/migrate_widget_background_controller.py
      - name: Commit migration and self-remove runner
        shell: bash
        run: |
          rm -f scripts/migrate_widget_background_controller.py
          rm -f .github/workflows/migrate-widget-background-controller.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: route widget ownership through controller'
          git push origin HEAD:feat/widget-dark-content-adaptation
