name: OS4 edge GUI gate one-shot

on:
  push:
    branches:
      - port/os4-original-background-edge
    paths:
      - scripts/apply_os4_edge_gui_gate.py
      - .github/workflows/os4-edge-gui-gate-one-shot.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/os4-original-background-edge
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply exact OS4 GUI/gate patch
        run: python3 scripts/apply_os4_edge_gui_gate.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Focused OS4 runtime config tests
        run: ./gradlew testDebugUnitTest --tests com.hellovoid.liquiddock.Os4EdgeConfigRuntimeTest --stacktrace
      - name: Focused OS4 highlight gate tests
        run: ./gradlew :prismal:testDebugUnitTest --tests com.hellovoid.prismal.PrismalOs4HighlightGateContractTest --stacktrace
      - name: Full verification
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Commit verified production patch and self-delete
        run: |
          rm -f scripts/apply_os4_edge_gui_gate.py .github/workflows/os4-edge-gui-gate-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose and gate OS4 edge controls"
          git push origin HEAD:port/os4-original-background-edge
