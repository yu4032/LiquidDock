name: OS4 original edge task1 one-shot

on:
  push:
    branches:
      - port/os4-original-background-edge

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/os4-original-background-edge
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Apply exact Task 1 patch
        run: python3 scripts/os4_original_task1_patch.py
      - name: Verify focused Task 1 GREEN
        run: |
          chmod +x ./gradlew
          ./gradlew :prismal:testDebugUnitTest --tests 'com.hellovoid.prismal.PrismalOs4OriginalEdgeContractTest.exposesOriginalOs4EdgeControlsAndBindsThem' --stacktrace
      - name: Commit production patch and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prismal/src/main/java/com/hellovoid/prismal/PrismalParams.java prismal/src/main/java/com/hellovoid/prismal/PrismalRenderer.java
          git commit -m 'feat: expose original OS4 edge controls'
          git rm scripts/os4_original_task1_patch.py .github/workflows/os4-original-task1-one-shot.yml
          git commit -m 'ci: remove OS4 task1 one-shot'
          git push origin HEAD:port/os4-original-background-edge
