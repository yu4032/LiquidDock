name: Patch Gboard bottom docking settings once v2

on:
  push:
    branches:
      - feat/gboard-disable-bottom-docking
    paths:
      - .github/workflows/patch-gboard-bottom-docking-once-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gboard-disable-bottom-docking
      - name: Patch Gboard settings page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/kotlin/com/hellovoid/liquiddock/GboardSettingsPages.kt')
          text = path.read_text()

          resize_default = 'GboardGlassPreferences.AUTO_RESIZE_AFTER_HANDLE_DRAG_DEFAULT,'
          default_pos = text.find(resize_default)
          if default_pos < 0:
              raise SystemExit('resize default marker not found')
          state_end = text.find('\n    }', default_pos)
          if state_end < 0:
              raise SystemExit('resize state end not found')
          state_end += len('\n    }')
          state_block = '''
              var bottomDockingEnabled by remember {
                  mutableStateOf(
                      prefs.getBoolean(
                          GboardGlassPreferences.BOTTOM_DOCKING_KEY,
                          GboardGlassPreferences.BOTTOM_DOCKING_DEFAULT,
                      ),
                  )
              }'''
          text = text[:state_end] + state_block + text[state_end:]

          resize_title = 'title = "拖动后自动进入大小调整"'
          title_pos = text.find(resize_title)
          if title_pos < 0:
              raise SystemExit('resize switch title not found')
          switch_end = text.find('\n                )', title_pos)
          if switch_end < 0:
              raise SystemExit('resize switch end not found')
          switch_end += len('\n                )')
          switch_block = '''
                  SwitchPreference(
                      checked = bottomDockingEnabled,
                      onCheckedChange = {
                          bottomDockingEnabled = it
                          prefs.edit()
                              .putBoolean(GboardGlassPreferences.BOTTOM_DOCKING_KEY, it)
                              .apply()
                      },
                      title = "拖到底部切换为全尺寸键盘",
                      summary = "关闭后，悬浮键盘进入底部区域时不触发震动、Dock 提示动画或全尺寸键盘切换",
                      enabled = masterEnabled,
                  )'''
          text = text[:switch_end] + switch_block + text[switch_end:]
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/kotlin/com/hellovoid/liquiddock/GboardSettingsPages.kt
          git commit -m "feat: add Gboard bottom docking switch"
          git push origin HEAD:feat/gboard-disable-bottom-docking
