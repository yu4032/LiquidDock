name: temporary shortcut dark mode UI patch
on:
  push:
    branches:
      - feat/shortcut-menu-white-text
    paths:
      - .github/workflows/_temp_shortcut_dark_mode_ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shortcut-menu-white-text
      - name: Patch setting text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt')
          text = path.read_text()
          old = '''            "快捷菜单深色模式文字",\n            "将桌面快捷菜单文字改为白色；关闭后保留系统原生文字颜色，重启桌面后生效",\n'''
          new = '''            "快捷菜单深色模式适配",\n            "将快捷菜单文字和图标统一改为白色；关闭后保留系统原样，重启桌面后生效",\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt
          git commit -m 'feat: describe shortcut menu dark mode adaptation'
          git push origin HEAD:feat/shortcut-menu-white-text
