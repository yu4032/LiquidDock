name: LiquidDock4 isolated foundation

on:
  push:
    branches: [liquiddock4, fix/os4-27d78f8-audit]
  pull_request:
    branches: [liquiddock4]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Native process isolation
        run: |
          cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Ios4/native \
            os4/native/process_gate.c os4/tests/process_gate_test.c \
            -o /tmp/os4-process-gate-test
          /tmp/os4-process-gate-test
          cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Ios4/native \
            os4/tests/grid_conf_test.c -o /tmp/os4-grid-conf-test
          /tmp/os4-grid-conf-test
          cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Ios4/native \
            os4/tests/dock_y_direct_test.c -lm -o /tmp/os4-dock-bottom-test
          /tmp/os4-dock-bottom-test
          cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Ios4/native \
            os4/tests/sha256_test.c -o /tmp/os4-sha256-test
          /tmp/os4-sha256-test
      - name: Native independent layout and patch lifetime tests
        run: |
          set -euo pipefail
          for test in layout_memory layout_changes layout_load executable_range layout_runtime hook_page_pin; do
            cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror \
              "os4/tests/${test}_test.c" -o "/tmp/os4-${test}-test"
            "/tmp/os4-${test}-test"
          done
      - name: Offline AOT binary identity and target checks
        run: python3 -m unittest discover -s os4/tests -p 'test_*.py' -v
      - name: Compile actual ARM64 native backend
        run: |
          set -euo pipefail
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "$NDK" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
            [[ -n "$SDKMANAGER" ]] || { echo 'Android SDK manager unavailable' >&2; exit 1; }
            "$SDKMANAGER" --install "ndk;28.2.13676358" >/dev/null
            NDK="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          ANDROID_NDK_HOME="$NDK" bash os4/native/build.sh
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -Ws os4/out/libliquiddock4.so | grep ' native_init$'
      - name: Android and compatibility policy tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Package and debug-sign installable OS4 APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(build/outputs/apk/debug/*.apk)
          [[ "${#APKS[@]}" -eq 1 ]] || { echo "Expected exactly one debug APK" >&2; exit 1; }
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          [[ -x "$TOOLS/apksigner" ]] || { echo "apksigner not found" >&2; exit 1; }
          "$TOOLS/apksigner" sign --help | grep -F -q -- '--alignment-preserved'
          python3 os4/tools/package_native.py "${APKS[0]}" os4/out/libliquiddock4.so os4/out/LiquidDock4-unsigned.apk
          "$TOOLS/apksigner" sign \
            --ks signing/hellovoid-debug.keystore \
            --ks-key-alias hellovoid-debug \
            --ks-pass pass:hellovoid-debug \
            --key-pass pass:hellovoid-debug \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --alignment-preserved true \
            --out os4/out/LiquidDock4-fuxi-debug.apk \
            os4/out/LiquidDock4-unsigned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs os4/out/LiquidDock4-fuxi-debug.apk
          python3 os4/tools/verify_installer.py \
            os4/out/LiquidDock4-fuxi-debug.apk os4/out/libliquiddock4.so
          {
            echo "Source: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Signature: Public, fixed LiquidDock debug test key (not release)"
            sha256sum os4/out/LiquidDock4-fuxi-debug.apk
            sha256sum os4/out/libliquiddock4.so
          } > os4/out/LiquidDock4-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock4-fuxi-debug-${{ github.sha }}
          path: |
            os4/out/LiquidDock4-fuxi-debug.apk
            os4/out/LiquidDock4-provenance.txt
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
