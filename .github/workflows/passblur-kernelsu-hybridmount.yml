name: PassBlur KernelSU HybridMount

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'native/passblur-kernelsu-hybridmount/**'
      - '.github/workflows/passblur-kernelsu-hybridmount.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact SurfaceFlinger input
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/liquidui-passblur-gfx-input.tar.gz \
            'https://github.com/yu4032/hyperos-analysis/releases/download/Libs/liquidui-passblur-gfx-input.tar.gz'
          echo '57e25e06f70aa3e3da98dbeb16fbcc6e6e9d2ecd541f96568dc043e91804282f  /tmp/liquidui-passblur-gfx-input.tar.gz' \
            | sha256sum -c -
          mkdir -p /tmp/passblur-input
          tar -xzf /tmp/liquidui-passblur-gfx-input.tar.gz -C /tmp/passblur-input

      - name: Build exact patched SurfaceFlinger
        shell: bash
        run: |
          set -euo pipefail
          root='native/passblur-kernelsu-hybridmount'
          stock='/tmp/passblur-input/passblur-gfx-input/files/libsurfaceflinger.so'
          module='/tmp/LiquidDock-PassBlur-KernelSU-HybridMount'
          payload="$module/system/system_ext/lib64/libsurfaceflinger.so"

          test "$(sha256sum "$stock" | awk '{print $1}')" = \
            '407be876ceadc0ac5254abcc357ed2c196fbbf6179c940bc75d1ddf05f63ae32'

          mkdir -p "$(dirname "$payload")"
          python3 "$root/build_patched_surfaceflinger.py" "$stock" "$payload"

          test "$(sha256sum "$payload" | awk '{print $1}')" = \
            '7cb2123d0b5d5cfd9ae63699c9624ebe306392b88f642ec609fdb5fc2247e30f'
          readelf -n "$payload" | grep -F 'Build ID: 39691db140edc0663fab2fde2475c091'

          python3 - "$payload" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          assert data[0x421804:0x421808] == bytes.fromhex('80018052')
          print('0x421804 = mov w0,#12 verified')
          PY

          cp "$root/module.prop" "$module/module.prop"
          cp "$root/customize.sh" "$module/customize.sh"
          cp "$root/original.sha256" "$module/original.sha256"
          cp "$root/patched.sha256" "$module/patched.sha256"
          chmod 0755 "$module/customize.sh"
          chmod 0644 "$module/module.prop" "$module/original.sha256" "$module/patched.sha256"

      - name: Package KernelSU HybridMount module
        shell: bash
        run: |
          set -euo pipefail
          module='/tmp/LiquidDock-PassBlur-KernelSU-HybridMount'
          out='out'
          name='LiquidDock-PassBlur-KernelSU-HybridMount-OS3.0.310.0.WAOCNXM-Pacing12.zip'
          mkdir -p "$out"

          (
            cd "$module"
            zip -9 -r "$GITHUB_WORKSPACE/$out/$name" \
              module.prop customize.sh original.sha256 patched.sha256 system
          )

          unzip -l "$out/$name"
          echo '--- artifact sha256 ---'
          sha256sum "$out/$name" | tee "$out/$name.sha256"

          python3 - "$out/$name" <<'PY'
          import sys, zipfile
          expected = {
              'module.prop',
              'customize.sh',
              'original.sha256',
              'patched.sha256',
              'system/',
              'system/system_ext/',
              'system/system_ext/lib64/',
              'system/system_ext/lib64/libsurfaceflinger.so',
          }
          with zipfile.ZipFile(sys.argv[1]) as zf:
              actual = set(zf.namelist())
          if actual != expected:
              raise SystemExit(f'unexpected module layout: {sorted(actual)}')
          print('HybridMount ZIP layout verified')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-PassBlur-KernelSU-HybridMount
          path: |
            out/LiquidDock-PassBlur-KernelSU-HybridMount-OS3.0.310.0.WAOCNXM-Pacing12.zip
            out/LiquidDock-PassBlur-KernelSU-HybridMount-OS3.0.310.0.WAOCNXM-Pacing12.zip.sha256
          if-no-files-found: error
          retention-days: 7
