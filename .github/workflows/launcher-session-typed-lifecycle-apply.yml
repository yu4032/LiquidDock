name: One-shot launcher session typed lifecycle patch

on:
  push:
    branches: [ refactor/hookutil-vendor-contract ]

permissions:
  contents: write

concurrency:
  group: launcher-session-typed-lifecycle-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/hookutil-vendor-contract
          fetch-depth: 0
      - name: Apply exact replacements
        run: python scripts/apply-launcher-session-typed-lifecycle.py
      - name: Verify patch
        run: |
          git diff --check
          ! grep -n 'HookUtil' src/main/java/com/hellovoid/liquiddock/LauncherGlassSessionRegistry.java
          ! grep -n 'renderHandler' src/main/java/com/hellovoid/liquiddock/LauncherGlassSessionRegistry.java
          grep -n 'boolean suspendProducerForUnlockCapture()' src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java
          grep -n 'boolean rebindProducer(Runnable rolloverComplete)' src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java
      - name: Commit patch and remove applicator
        run: |
          git config user.name "yu4032"
          git config user.email "4032542465@smail.lnu.edu.cn"
          git rm .github/workflows/launcher-session-typed-lifecycle-apply.yml scripts/apply-launcher-session-typed-lifecycle.py
          git add \
            src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java \
            src/main/java/com/hellovoid/liquiddock/LauncherGlassSessionRegistry.java
          git commit -m "refactor: replace launcher session self-reflection"
          git push origin HEAD:refactor/hookutil-vendor-contract
