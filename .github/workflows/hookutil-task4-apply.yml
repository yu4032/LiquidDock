name: One-shot HookUtil Task4 patch

on:
  push:
    branches: [ refactor/hookutil-vendor-contract ]

permissions:
  contents: write

concurrency:
  group: hookutil-task4-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/hookutil-vendor-contract
          fetch-depth: 0
      - name: Apply exact replacements
        run: python scripts/apply-hookutil-task4.py
      - name: Verify patch
        run: |
          git diff --check
          ! grep -R -n -E 'HookUtil\.invoke\(|HookUtil\.invokeStatic\(' \
            src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java \
            src/main/java/com/hellovoid/liquiddock/DockStrokeRenderer.java \
            src/main/java/com/hellovoid/liquiddock/MiuixFolderGlassHook.java \
            src/main/java/com/hellovoid/liquiddock/MiuixLauncherStaticGlassHook.java
      - name: Commit patch and remove applicator
        run: |
          git config user.name "yu4032"
          git config user.email "4032542465@smail.lnu.edu.cn"
          git rm .github/workflows/hookutil-task4-apply.yml scripts/apply-hookutil-task4.py
          git add src/main/java/com/hellovoid/liquiddock \
                  src/test/java/com/hellovoid/liquiddock/LauncherGlassVendorMaterialSuppressionContractTest.java
          git commit -m "refactor: migrate dock and glass vendor reflection"
          git push origin HEAD:refactor/hookutil-vendor-contract
