name: PR83 widget settings patch

on:
  push:
    branches:
      - fix/450-workstation-stroke-widget-backgrounds

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/450-workstation-stroke-widget-backgrounds
      - name: Patch schema and Compose routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def lines(path):
              return path.read_text().splitlines()

          def unique_index(rows, stripped, label):
              matches = [i for i, row in enumerate(rows) if row.strip() == stripped]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {len(matches)}")
              return matches[0]

          schema = Path("src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java")
          rows = lines(schema)
          i = unique_index(rows,
              "public static final ConfigKey<Boolean> WIDGET_DARK_CONTENT = bool(",
              "ConfigSchema widget key anchor")
          if rows[i + 1].strip() != '"liquid_widget_dark_content", false, false, false, ConfigKey.ExportMode.ALWAYS);':
              raise SystemExit("ConfigSchema widget key body changed")
          rows[i + 2:i + 2] = [
              "        public static final ConfigKey<Boolean> WIDGET_BACKGROUND_BUILTIN_RULES = bool(",
              "                \"liquid_widget_background_builtin_rules\", true, true, true,",
              "                ConfigKey.ExportMode.ALWAYS);",
              "        public static final ConfigKey<String> WIDGET_BACKGROUND_USER_RULES = string(",
              "                \"liquid_widget_background_user_rules\", \"\", \"\", \"\",",
              "                ConfigKey.ExportMode.ALWAYS);",
          ]
          j = unique_index(rows,
              "Glass.WIDGET_DARK_CONTENT, Glass.ICON_GLASS,",
              "ConfigSchema all() anchor")
          rows[j:j + 1] = [
              "                Glass.WIDGET_DARK_CONTENT, Glass.WIDGET_BACKGROUND_BUILTIN_RULES,",
              "                Glass.WIDGET_BACKGROUND_USER_RULES, Glass.ICON_GLASS,",
          ]
          schema.write_text("\n".join(rows) + "\n")

          compose = Path("src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt")
          rows = lines(compose)
          i = unique_index(rows, "LauncherHighlights(R.string.page_launcher_highlights),", "Compose Page enum")
          if rows[i - 1].strip() != "Liquid(R.string.page_liquid),":
              raise SystemExit("Compose Liquid enum anchor changed")
          rows.insert(i, "    WidgetBackgrounds(R.string.page_widget_backgrounds),")

          i = unique_index(rows, "Page.LauncherHighlights -> Page.Liquid", "Compose parent page")
          rows[i] = "    Page.LauncherHighlights, Page.WidgetBackgrounds -> Page.Liquid"

          i = unique_index(rows,
              "Page.Liquid -> LiquidPage(padding, prefs, masterEnabled) { page = Page.LauncherHighlights }",
              "Compose Liquid route")
          if rows[i + 1].strip() != "Page.LauncherHighlights -> LauncherHighlightsPage(padding, prefs, masterEnabled)":
              raise SystemExit("Compose LauncherHighlights route anchor changed")
          rows[i:i + 2] = [
              "                Page.Liquid -> LiquidPage(",
              "                    padding,",
              "                    prefs,",
              "                    masterEnabled,",
              "                    openLauncherHighlights = { page = Page.LauncherHighlights },",
              "                    openWidgetBackgrounds = { page = Page.WidgetBackgrounds },",
              "                )",
              "                Page.WidgetBackgrounds -> WidgetBackgroundSettingsPage(padding, prefs, masterEnabled)",
              "                Page.LauncherHighlights -> LauncherHighlightsPage(padding, prefs, masterEnabled)",
          ]

          i = unique_index(rows, "openLauncherHighlights: () -> Unit,", "LiquidPage signature")
          if not any(row.strip() == "private fun LiquidPage(" for row in rows[max(0, i - 5):i]):
              raise SystemExit("LiquidPage signature anchor changed")
          rows.insert(i + 1, "    openWidgetBackgrounds: () -> Unit,")

          i = unique_index(rows,
              "IntSetting(prefs, largeFolderCornerRadiusSpec, masterEnabled && liquidGlass && largeFolderGlass)",
              "LiquidPage widget entry anchor")
          if rows[i + 1].strip() != "ArrowPreference(" or rows[i + 2].strip() != "stringResource(R.string.launcher_highlights_entry),":
              raise SystemExit("LiquidPage launcher highlight entry anchor changed")
          rows[i + 1:i + 1] = [
              "        ArrowPreference(",
              "            stringResource(R.string.page_widget_backgrounds),",
              "            summary = \"从 Launcher 4.50 实时发现的 MAML / RemoteViews 元素中逐项选择要隐藏的背景\",",
              "            enabled = masterEnabled && liquidGlass && widgetGlass,",
              "            onClick = openWidgetBackgrounds,",
              "        )",
          ]
          compose.write_text("\n".join(rows) + "\n")
          PY
      - name: Commit exact wiring patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr83-widget-settings-patch.yml
          git add src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java
          git add src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt
          git commit -m "feat: wire widget background settings controls"
          git push origin HEAD:fix/450-workstation-stroke-widget-backgrounds
