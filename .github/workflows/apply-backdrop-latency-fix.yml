name: Apply Workspace backdrop latency patch

on:
  push:
    branches: [ fix-workspace-glass-backdrop-latency ]
    paths:
      - '.github/workflows/apply-backdrop-latency-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-workspace-glass-backdrop-latency
          fetch-depth: 0

      - name: Apply geometry-only late-latch patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java')
          text = path.read_text()

          field_anchor = '    private final AtomicBoolean frameAvailable = new AtomicBoolean(false);\n'
          if field_anchor not in text:
              raise SystemExit('field insertion anchor not found')
          text = text.replace(
              field_anchor,
              field_anchor
              + '    private final LauncherGlassScrollProjectionState workspaceScrollProjection =\n'
              + '            new LauncherGlassScrollProjectionState();\n',
              1)

          method_anchor = '    void suspendWorkspaceProducer() {\n'
          if method_anchor not in text:
              raise SystemExit('method insertion anchor not found')
          methods = '''    void onWorkspaceScrollMutation(int beforeScrollX, int afterScrollX) {
              if (shuttingDown || beforeScrollX == afterScrollX) return;
              workspaceScrollProjection.onScrollMutation(beforeScrollX, afterScrollX);
              // Geometry-only redraw: reuse the prepared root-space backdrop. A producer refresh
              // here would merely chase Launcher wallpaper Binder latency and reintroduce phase lag.
              requestStaticRedraw();
          }

              void resetWorkspaceScrollProjection() {
                  workspaceScrollProjection.reset();
              }

          '''
          text = text.replace(method_anchor, methods + method_anchor, 1)

          start_marker = '    private void renderStaticScene(PrismalParams params) {\n'
          end_marker = '    private void renderDragOutputs(PrismalParams params) {\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('renderStaticScene structural anchors not found')
          replacement = '''    private void renderStaticScene(PrismalParams params) {
              OutputState output = staticOutput;
              if (output == null || output.eglSurface == EGL14.EGL_NO_SURFACE) return;
              makePbufferCurrent();
              prismalRenderer.beginGlassFrame();
              List<StaticNodeState> snapshot;
              synchronized (staticNodes) { snapshot = new ArrayList<>(staticNodes.values()); }
              for (StaticNodeState state : snapshot) {
                  LauncherGlassStaticNode node = state.nodeRef.get();
                  StaticGeometryFrame frame = state.frame;
                  LauncherGlassGeometry.Snapshot geometry = frame != null ? frame.geometry : null;
                  if (node == null || geometry == null) continue;
                  float projectedCenterX = workspaceScrollProjection.projectCenterX(
                          geometry.centerX, frame.workspaceScrollX, frame.workspaceScrollValid);
                  PrismalGeometry prismalGeometry = new PrismalGeometry(
                          rootWidth, rootHeight, projectedCenterX, geometry.centerY,
                          geometry.width, geometry.height, geometry.cornerRadius);
                  PrismalHighlightProfile highlights = LauncherHighlightProfilePolicy.select(
                          node.nodeKind(), launcherHighlightProfile, largeSurfaceHighlightProfile);
                  prismalRenderer.drawGlass(prismalGeometry, params, highlights,
                          state.interaction, node.visibilityAlpha());
              }
              presentFull(prismalRenderer.outputTexture(), output);
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          legacy = Path('src/main/java/com/hellovoid/liquiddock/LauncherGlassScrollCompensationState.java')
          if legacy.exists():
              legacy.unlink()
          PY

          git diff --check
          git diff --exit-code -- src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java >/dev/null && {
            echo 'LauncherGlassSession.java was not modified' >&2
            exit 1
          }

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java \
                  src/main/java/com/hellovoid/liquiddock/LauncherGlassScrollCompensationState.java
          git commit -m 'fix: project Workspace glass geometry over root backdrop'
          git push origin HEAD:fix-workspace-glass-backdrop-latency
