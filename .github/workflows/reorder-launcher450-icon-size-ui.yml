name: Reorder Launcher 4.50 icon size UI

on:
  push:
    branches:
      - fix/launcher450-folder-inner-icon-size
    paths:
      - .github/workflows/reorder-launcher450-icon-size-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launcher450-folder-inner-icon-size
      - name: Reorder icon-size section
        run: python3 .github/scripts/reorder_launcher450_icon_size_ui.py
      - name: Commit UI reorder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt
          git diff --cached --check
          git commit -m "ui: move Launcher 4.50 icon size above grid settings"
          git push origin HEAD:fix/launcher450-folder-inner-icon-size
