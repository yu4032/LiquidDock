name: One-shot third-party restart refactor

on:
  push:
    branches: [ refactor/third-party-app-restart-descriptor ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/third-party-app-restart-descriptor
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Apply bounded refactor
        shell: python
        run: |
          from pathlib import Path
          import re

          compose_path = Path('src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt')
          activity_path = Path('src/main/java/com/hellovoid/liquiddock/SettingsActivity.java')
          policy_path = Path('src/test/java/com/hellovoid/liquiddock/RuntimeBehaviorTestPolicyContractTest.java')
          legacy_test_path = Path('src/test/java/com/hellovoid/liquiddock/GboardFloatingResizeAndHandlePolicyTest.java')

          compose = compose_path.read_text()
          anchor = '''private fun parentPage(page: Page): Page = when (page) {
              Page.Gboard -> Page.ThirdPartyApps
              Page.ThirdPartyApps, Page.LauncherHighlights, Page.WidgetComponents -> Page.Liquid
              else -> Page.Home
          }
          '''
          descriptor = '''private fun parentPage(page: Page): Page = when (page) {
              Page.Gboard -> Page.ThirdPartyApps
              Page.ThirdPartyApps, Page.LauncherHighlights, Page.WidgetComponents -> Page.Liquid
              else -> Page.Home
          }

          private data class ThirdPartyAppPageDescriptor(
              val packageName: String,
              val displayName: String,
              val restartLabelRes: Int,
          )

          private val THIRD_PARTY_APP_PAGES = mapOf(
              Page.Gboard to ThirdPartyAppPageDescriptor(
                  packageName = "com.google.android.inputmethod.latin",
                  displayName = "Gboard",
                  restartLabelRes = R.string.action_restart_gboard,
              ),
          )
          '''
          if anchor not in compose:
              raise SystemExit('parentPage anchor not found')
          compose = compose.replace(anchor, descriptor, 1)

          old_actions = '''                    if (page == Page.Gboard) {
                                  TextButton(text = stringResource(R.string.action_restart_gboard), onClick = { activity.restartGboard() })
                              } else {
                                  TextButton(text = stringResource(R.string.action_restart_launcher), onClick = { activity.restartLauncher() })
                              }
          '''
          new_actions = '''                    val descriptor = THIRD_PARTY_APP_PAGES[page]
                              if (descriptor != null) {
                                  TextButton(
                                      text = stringResource(descriptor.restartLabelRes),
                                      onClick = {
                                          activity.restartPackageProcess(
                                              descriptor.packageName,
                                              descriptor.displayName,
                                          )
                                      },
                                  )
                              } else {
                                  TextButton(text = stringResource(R.string.action_restart_launcher), onClick = { activity.restartLauncher() })
                              }
          '''
          if old_actions not in compose:
              raise SystemExit('top bar Gboard action anchor not found')
          compose = compose.replace(old_actions, new_actions, 1)
          compose_path.write_text(compose)

          activity = activity_path.read_text()
          replacement = '''    void restartPackageProcess(String packageName, String displayName) {
              // Third-party app descriptors provide trusted static process names. Validate the value
              // anyway so future entries cannot accidentally turn this shell command into an injection path.
              if (packageName == null || !packageName.matches("[A-Za-z0-9_.:]+")
                      || displayName == null || displayName.isBlank()) {
                  Toast.makeText(this, "Invalid app restart target", Toast.LENGTH_SHORT).show();
                  return;
              }
              LiquidDockApp.syncToRemote(PreferenceManager.getDefaultSharedPreferences(this));
              new Thread(() -> {
                  try {
                      Process p = new ProcessBuilder("su")
                              .redirectOutput(ProcessBuilder.Redirect.to(new java.io.File("/dev/null")))
                              .redirectError(ProcessBuilder.Redirect.to(new java.io.File("/dev/null")))
                              .start();
                      try (DataOutputStream os = new DataOutputStream(p.getOutputStream())) {
                          os.writeBytes("PIDS=$(pidof " + packageName + "); "
                                  + "if [ -z \\\"$PIDS\\\" ]; then exit 1; fi; "
                                  + "kill -TERM $PIDS\\nexit\\n");
                          os.flush();
                      }
                      if (!p.waitFor(8, TimeUnit.SECONDS)) {
                          p.destroy();
                          if (!p.waitFor(1, TimeUnit.SECONDS)) p.destroyForcibly();
                          throw new IOException("su timed out while restarting " + displayName);
                      }
                      int exitCode = p.exitValue();
                      if (exitCode != 0) {
                          throw new IOException(displayName + " process is not running");
                      }
                  } catch (InterruptedException e) {
                      Thread.currentThread().interrupt();
                      runOnUiThread(() -> Toast.makeText(this,
                              displayName + " restart interrupted", Toast.LENGTH_SHORT).show());
                  } catch (Exception e) {
                      runOnUiThread(() -> Toast.makeText(this,
                              "Error: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                  }
              }).start();
          }

          void restartSecurityCenter()'''
          pattern = re.compile(r'    void restartGboard\(\) \{.*?\n    \}\n\n    void restartSecurityCenter\(\)', re.S)
          activity, count = pattern.subn(replacement, activity, count=1)
          if count != 1:
              raise SystemExit(f'restartGboard block replacement count={count}')
          activity_path.write_text(activity)

          policy = policy_path.read_text()
          policy_anchor = '            "GboardFloatingResizeAndHandlePolicyTest.java",\n'
          if policy_anchor not in policy:
              raise SystemExit('static allowlist anchor not found')
          policy = policy.replace(
              policy_anchor,
              policy_anchor + '            "ThirdPartyAppRestartDescriptorTest.java",\n',
              1,
          )
          policy_path.write_text(policy)

          legacy_test = legacy_test_path.read_text()
          legacy_test, count = re.subn(
              r'\n    @Test public void gboardPageRestartsGboardInsteadOfLauncher\(\) throws Exception \{.*?\n    \}',
              '',
              legacy_test,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'legacy Gboard restart contract removal count={count}')
          legacy_test_path.write_text(legacy_test)

          workflow = Path('.github/workflows/agent-third-party-restart-refactor.yml')
          workflow.unlink()
      - name: Verify full debug build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Commit verified refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: generalize third-party app restart actions"
          git push origin HEAD:refactor/third-party-app-restart-descriptor
