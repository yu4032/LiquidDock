name: Patch settings SystemUI restart visibility

on:
  push:
    branches:
      - feature-systemui-home-transition-timing
    paths:
      - .github/workflows/patch-settings-systemui-root-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-systemui-home-transition-timing
      - name: Guard SystemUI restart behind Home page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt')
          source = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)TextButton\(text = stringResource\(R\.string\.action_restart_launcher\), onClick = \{ activity\.restartLauncher\(\) \}\)\n'
              r'(?P=indent)TextButton\(text = stringResource\(R\.string\.action_restart_system_ui\), onClick = \{ activity\.restartSystemUi\(\) \}\)$'
          )
          match = pattern.search(source)
          if match is None:
              raise SystemExit('expected adjacent restart actions not found')
          indent = match.group('indent')
          replacement = (
              indent + 'TextButton(text = stringResource(R.string.action_restart_launcher), onClick = { activity.restartLauncher() })\n'
              + indent + 'if (page == Page.Home) {\n'
              + indent + '    TextButton(text = stringResource(R.string.action_restart_system_ui), onClick = { activity.restartSystemUi() })\n'
              + indent + '}'
          )
          path.write_text(source[:match.start()] + replacement + source[match.end():])
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt
          git rm .github/workflows/patch-settings-systemui-root-only.yml
          git commit -m 'ui: show SystemUI restart only on root settings page'
          git push origin HEAD:feature-systemui-home-transition-timing
