name: One-shot final production source reader audit

on:
  push:
    branches:
      - refactor/pure-runtime-state-tests
    paths:
      - .github/workflows/one-shot-final-source-reader-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pure-runtime-state-tests
      - name: Enumerate production-source-reading tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('src/test/java')
          readers = []
          for path in sorted(root.rglob('*.java')):
              text = path.read_text(errors='replace')
              production_ref = any(token in text for token in (
                  'src/main/java', 'src/main/kotlin', 'src/main/AndroidManifest.xml',
                  'build.gradle', 'settings.gradle'))
              source_read = 'Files.readString(' in text or 'Files.readAllBytes(' in text
              if not (production_ref and source_read):
                  continue
              readers.append(path.name)
              print(f'### {path.name}')
              for number, line in enumerate(text.splitlines(), 1):
                  s = line.strip()
                  if ('Files.read' in s or 'assert' in s or 'indexOf(' in s
                          or 'substring(' in s or '.contains(' in s):
                      print(f'{number}: {s}')
          print('SOURCE_READERS=' + ','.join(readers))
          print(f'TOTAL_SOURCE_READERS={len(readers)}')
          PY
