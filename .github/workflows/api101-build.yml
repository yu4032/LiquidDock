name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply Glass Scene production patch
        run: python3 ci/glass_scene_runner.py
      - name: Apply Glass performance patch
        run: python3 ci/glass_perf_runner.py
      - name: Apply idle Workspace and continuous Dock fix
        run: python3 ci/glass_idle_dock_fix.py
      - name: Apply drag component-style handoff fix
        run: python3 ci/glass_drag_style_fix.py
      - name: Remove duplicate drag material sync
        run: python3 ci/glass_drag_perf_fix.py
      - name: Update Scheme A regression contracts
        run: python3 ci/glass_contract_compact.py
      - name: Repair generated contract quoting
        run: python3 ci/glass_contract_escape_fix.py
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - name: Materialize verified Glass Scene sources
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/folder-press-glow' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          MATERIALIZE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -rf /tmp/liquiddock-glass-main /tmp/liquiddock-glass-test
          cp -a src/main /tmp/liquiddock-glass-main
          cp -a src/test /tmp/liquiddock-glass-test

          git fetch origin "${MATERIALIZE_BRANCH}" --depth=1
          git checkout -B materialize "origin/${MATERIALIZE_BRANCH}"

          rm -rf src/main src/test
          cp -a /tmp/liquiddock-glass-main src/main
          cp -a /tmp/liquiddock-glass-test src/test

          rm -f \
            .github/workflows/glass-scene-apply.yml \
            ci/glass_contract_compact.py \
            ci/glass_contract_escape_fix.py \
            ci/glass_drag_perf_fix.py \
            ci/glass_drag_style_fix.py \
            ci/glass_idle_dock_fix.py \
            ci/glass_perf_apply.py \
            ci/glass_perf_runner.py \
            ci/glass_scene_apply.py \
            ci/glass_scene_runner.py

          python3 - <<'PY'
          from pathlib import Path
          workflow = """name: API101 migration build

          on:
            push:
              branches:
                - main
                - api101-migration
                - refactor/modular-architecture
                - 'fix/**'
                - 'feat/**'
                - 'demo/**'
            pull_request:
              branches: [ main ]
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                    cache: gradle
                - uses: gradle/actions/setup-gradle@v4
                - run: chmod +x ./gradlew
                - run: ./gradlew testDebugUnitTest --stacktrace
                - run: ./gradlew assembleDebug --stacktrace
                - uses: actions/upload-artifact@v4
                  with:
                    name: LiquidDock-api101-debug
                    path: build/outputs/apk/debug/*.apk
                    if-no-files-found: error
                    retention-days: 7
                # Keep the same Gradle verification gates on main and active API101 development branches.
          """
          Path('.github/workflows/api101-build.yml').write_text(workflow.replace('          ', ''))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'feat: materialize glass scene architecture'
          git push origin HEAD:"${MATERIALIZE_BRANCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
