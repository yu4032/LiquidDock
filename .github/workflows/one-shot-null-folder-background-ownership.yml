name: One-shot null folder background ownership

on:
  push:
    branches:
      - refactor/pure-runtime-state-tests
    paths:
      - .github/scripts/fix_null_folder_background_ownership.py
      - .github/workflows/one-shot-null-folder-background-ownership.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pure-runtime-state-tests
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_null_folder_background_ownership.py
      - run: git diff --check
      - name: Commit fix and remove applicator
        run: |
          rm .github/scripts/fix_null_folder_background_ownership.py
          rm .github/workflows/one-shot-null-folder-background-ownership.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/MiuixFolderGlassHook.java \
                  .github/scripts/fix_null_folder_background_ownership.py \
                  .github/workflows/one-shot-null-folder-background-ownership.yml
          git commit -m "fix: preserve null folder background ownership"
          git push origin HEAD:refactor/pure-runtime-state-tests
