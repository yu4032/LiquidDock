name: PassBlur KernelSU HybridMount source

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'native/passblur-kernelsu-hybridmount/**'
      - '.github/workflows/passblur-kernelsu-hybridmount.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HybridMount source
        shell: bash
        run: |
          set -euo pipefail
          root='native/passblur-kernelsu-hybridmount'

          python3 -m py_compile "$root/build_patched_surfaceflinger.py"
          sh -n "$root/customize.sh"

          test "$(tr -d '\r\n ' < "$root/original.sha256")" = \
            '407be876ceadc0ac5254abcc357ed2c196fbbf6179c940bc75d1ddf05f63ae32'
          test "$(tr -d '\r\n ' < "$root/previous.sha256")" = \
            'ef523f9d57ebe5c3af2ec39747b07ab6d70bd69165461e09ddc0fc8f13f5d563'
          test "$(tr -d '\r\n ' < "$root/patched.sha256")" = \
            '7cb2123d0b5d5cfd9ae63699c9624ebe306392b88f642ec609fdb5fc2247e30f'

          grep -F 'id=liquiddock_passblur_native' "$root/module.prop"
          grep -F 'Hybrid Mount' "$root/customize.sh"
          grep -F '7cb2123d0b5d5cfd9ae63699c9624ebe306392b88f642ec609fdb5fc2247e30f' \
            "$root/customize.sh"
          grep -F '(0x421804, bytes.fromhex("80018052"))' \
            "$root/build_patched_surfaceflinger.py"

      - name: Validate sparse patch manifest shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('native/passblur-kernelsu-hybridmount/build_patched_surfaceflinger.py')
          tree = ast.parse(path.read_text())
          constants = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1:
                  target = node.targets[0]
                  if isinstance(target, ast.Name) and isinstance(node.value, ast.Constant):
                      constants[target.id] = node.value.value

          assert constants['STOCK_SHA256'] == '407be876ceadc0ac5254abcc357ed2c196fbbf6179c940bc75d1ddf05f63ae32'
          assert constants['PREVIOUS_SHA256'] == 'ef523f9d57ebe5c3af2ec39747b07ab6d70bd69165461e09ddc0fc8f13f5d563'
          assert constants['PATCHED_SHA256'] == '7cb2123d0b5d5cfd9ae63699c9624ebe306392b88f642ec609fdb5fc2247e30f'
          assert constants['EXPECTED_SIZE'] == 11577024
          print('HybridMount source manifest verified')
          PY
