name: Apply static Launcher compositor migration

on:
  push:
    branches:
      - feat/folder-press-glow

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply approved static compositor migration
        run: python ci/apply_static_compositor.py
      - name: Restore standard CI and commit production tree
        run: |
          cat > .github/workflows/api101-build.yml <<'EOF'
          name: API101 migration build

          on:
            push:
              branches:
                - main
                - api101-migration
                - refactor/modular-architecture
                - 'fix/**'
                - 'feat/**'
                - 'demo/**'
            pull_request:
              branches: [ main ]
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                    cache: gradle
                - uses: gradle/actions/setup-gradle@v4
                - run: chmod +x ./gradlew
                - run: ./gradlew testDebugUnitTest --stacktrace
                - run: ./gradlew assembleDebug --stacktrace
                - uses: actions/upload-artifact@v4
                  with:
                    name: LiquidDock-api101-debug
                    path: build/outputs/apk/debug/*.apk
                    if-no-files-found: error
                    retention-days: 7
                # Keep the same Gradle verification gates on main and active API101 development branches.
          EOF
          rm ci/apply_static_compositor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: batch static launcher glass in one root layer'
          git push origin HEAD:feat/folder-press-glow
      - name: Focused compositor contracts
        run: ./gradlew testDebugUnitTest --tests '*LauncherGlassStaticCompositorContractTest' --tests '*LauncherGlassUnclippedGeometryContractTest' --stacktrace
      - name: Full unit suite
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
