name: Milestone2 task4 one-shot

on:
  push:
    branches:
      - port/os4-volumetric-edge-model
    paths:
      - .github/workflows/milestone2-task4-one-shot.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/os4-volumetric-edge-model
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Apply exact Task 4 production patch
        run: python3 scripts/milestone2_task4_patch.py
      - name: Verify full build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Commit production patch and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/milestone2_task4_patch.py
          rm .github/workflows/milestone2-task4-one-shot.yml
          git add prismal/src/main/java/com/hellovoid/prismal/PrismalRenderer.java \
                  prismal/src/main/java/com/hellovoid/prismal/PrismalBloomShaderSources.java \
                  scripts/milestone2_task4_patch.py \
                  .github/workflows/milestone2-task4-one-shot.yml
          git commit -m 'feat: render OS4 bloom in local FBO'
          git push origin HEAD:port/os4-volumetric-edge-model
