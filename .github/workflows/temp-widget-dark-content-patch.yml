name: temporary widget dark-content patch

on:
  push:
    branches: [ feat/widget-dark-content-adaptation ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/widget-dark-content-adaptation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing expected block in {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          # Config schema: opt-in, default off, persisted/exported like other live glass toggles.
          replace('src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java',
              '''        public static final ConfigKey<Boolean> WIDGET_GLASS = bool(\n                "liquid_widget_glass", true, true, true, ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Boolean> ICON_GLASS = bool(''',
              '''        public static final ConfigKey<Boolean> WIDGET_GLASS = bool(\n                "liquid_widget_glass", true, true, true, ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Boolean> WIDGET_DARK_CONTENT = bool(\n                "liquid_widget_dark_content", false, false, false, ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Boolean> ICON_GLASS = bool(''')
          replace('src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java',
              '''        add(keys, Glass.ENABLED, Glass.FOLDER_GLASS, Glass.WIDGET_GLASS, Glass.ICON_GLASS,''',
              '''        add(keys, Glass.ENABLED, Glass.FOLDER_GLASS, Glass.WIDGET_GLASS,\n                Glass.WIDGET_DARK_CONTENT, Glass.ICON_GLASS,''')

          # Runtime config.
          replace('src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java',
              '''        final boolean enabled, folderEnabled, widgetEnabled, iconEnabled;''',
              '''        final boolean enabled, folderEnabled, widgetEnabled, widgetDarkContent, iconEnabled;''')
          replace('src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java',
              '''            boolean resolvedWidgetEnabled = c.b(ConfigSchema.Glass.WIDGET_GLASS.name(),\n                    ConfigSchema.Glass.WIDGET_GLASS.runtimeFallback());''',
              '''            boolean resolvedWidgetEnabled = c.b(ConfigSchema.Glass.WIDGET_GLASS.name(),\n                    ConfigSchema.Glass.WIDGET_GLASS.runtimeFallback());\n            widgetDarkContent = c.b(ConfigSchema.Glass.WIDGET_DARK_CONTENT.name(),\n                    ConfigSchema.Glass.WIDGET_DARK_CONTENT.runtimeFallback());''')
          replace('src/main/java/com/hellovoid/liquiddock/ModuleMain.java',
              '''                    runtimeConfig.glass.widgetEnabled,\n                    runtimeConfig.glass.smallFolderStyle.enabled,''',
              '''                    runtimeConfig.glass.widgetEnabled,\n                    runtimeConfig.glass.widgetDarkContent,\n                    runtimeConfig.glass.smallFolderStyle.enabled,''')

          # Live process state.
          p = Path('src/main/java/com/hellovoid/liquiddock/GlassRuntimeState.java')
          s = p.read_text()
          pairs = [
              ('''    private static volatile boolean widgetEnabled;\n    private static volatile boolean smallFolderEnabled;''',
               '''    private static volatile boolean widgetEnabled;\n    private static volatile boolean widgetDarkContentEnabled;\n    private static volatile boolean smallFolderEnabled;'''),
              ('''            boolean initialWidgetEnabled,\n            boolean initialSmallFolderEnabled,''',
               '''            boolean initialWidgetEnabled,\n            boolean initialWidgetDarkContentEnabled,\n            boolean initialSmallFolderEnabled,'''),
              ('''        widgetEnabled = initialWidgetEnabled;\n        smallFolderEnabled = initialSmallFolderEnabled;''',
               '''        widgetEnabled = initialWidgetEnabled;\n        widgetDarkContentEnabled = initialWidgetDarkContentEnabled;\n        smallFolderEnabled = initialSmallFolderEnabled;'''),
              ('''                    && !ConfigSchema.Glass.WIDGET_GLASS.name().equals(key)\n                    && !ConfigSchema.Glass.SMALL_FOLDER_GLASS.name().equals(key)''',
               '''                    && !ConfigSchema.Glass.WIDGET_GLASS.name().equals(key)\n                    && !ConfigSchema.Glass.WIDGET_DARK_CONTENT.name().equals(key)\n                    && !ConfigSchema.Glass.SMALL_FOLDER_GLASS.name().equals(key)'''),
              ('''            boolean nextSmallFolderEnabled = sharedPreferences.getBoolean(''',
               '''            boolean nextWidgetDarkContentEnabled = sharedPreferences.getBoolean(\n                    ConfigSchema.Glass.WIDGET_DARK_CONTENT.name(),\n                    ConfigSchema.Glass.WIDGET_DARK_CONTENT.runtimeFallback());\n            boolean nextSmallFolderEnabled = sharedPreferences.getBoolean('''),
              ('''            apply(nextEnabled, nextIconEnabled, nextWidgetEnabled,\n                    nextSmallFolderEnabled, nextLargeFolderEnabled);''',
               '''            apply(nextEnabled, nextIconEnabled, nextWidgetEnabled, nextWidgetDarkContentEnabled,\n                    nextSmallFolderEnabled, nextLargeFolderEnabled);'''),
              ('''                + " widgetEnabled=" + isWidgetEnabled()\n                + " smallFolderEnabled="''',
               '''                + " widgetEnabled=" + isWidgetEnabled()\n                + " widgetDarkContentEnabled=" + isWidgetDarkContentEnabled()\n                + " smallFolderEnabled="'''),
              ('''    static boolean isWidgetEnabled() { return enabled && widgetEnabled; }\n    static boolean isSmallFolderEnabled()''',
               '''    static boolean isWidgetEnabled() { return enabled && widgetEnabled; }\n    static boolean isWidgetDarkContentEnabled() {\n        return isWidgetEnabled() && widgetDarkContentEnabled;\n    }\n    static boolean isSmallFolderEnabled()'''),
              ('''            boolean nextWidgetEnabled,\n            boolean nextSmallFolderEnabled,''',
               '''            boolean nextWidgetEnabled,\n            boolean nextWidgetDarkContentEnabled,\n            boolean nextSmallFolderEnabled,'''),
              ('''        boolean wasWidgetEnabled = isWidgetEnabled();\n        boolean wasSmallFolderEnabled''',
               '''        boolean wasWidgetEnabled = isWidgetEnabled();\n        boolean wasWidgetDarkContentEnabled = isWidgetDarkContentEnabled();\n        boolean wasSmallFolderEnabled'''),
              ('''                && widgetEnabled == nextWidgetEnabled\n                && smallFolderEnabled == nextSmallFolderEnabled''',
               '''                && widgetEnabled == nextWidgetEnabled\n                && widgetDarkContentEnabled == nextWidgetDarkContentEnabled\n                && smallFolderEnabled == nextSmallFolderEnabled'''),
              ('''        widgetEnabled = nextWidgetEnabled;\n        smallFolderEnabled = nextSmallFolderEnabled;''',
               '''        widgetEnabled = nextWidgetEnabled;\n        widgetDarkContentEnabled = nextWidgetDarkContentEnabled;\n        smallFolderEnabled = nextSmallFolderEnabled;'''),
              ('''        boolean nextLiveWidgetEnabled = isWidgetEnabled();\n        boolean nextLiveSmallFolderEnabled''',
               '''        boolean nextLiveWidgetEnabled = isWidgetEnabled();\n        boolean nextLiveWidgetDarkContentEnabled = isWidgetDarkContentEnabled();\n        boolean nextLiveSmallFolderEnabled'''),
              ('''                + " widgetEnabled=" + nextLiveWidgetEnabled\n                + " smallFolderEnabled="''',
               '''                + " widgetEnabled=" + nextLiveWidgetEnabled\n                + " widgetDarkContentEnabled=" + nextLiveWidgetDarkContentEnabled\n                + " smallFolderEnabled="'''),
          ]
          for old, new in pairs:
              if old not in s: raise SystemExit(f'missing GlassRuntimeState block: {old[:60]!r}')
              s = s.replace(old, new, 1)
          needle = '''        if (wasWidgetEnabled && !nextLiveWidgetEnabled) {\n            runOnMain(() -> {\n                MiuixLauncherStaticGlassHook.onRuntimeWidgetGlassDisabled();\n                MainHook.log("[DC][GlassRuntime] widget glass ownership released");\n            });\n        }\n'''
          if needle not in s: raise SystemExit('missing widget release block')
          s = s.replace(needle, needle + '''        if (wasWidgetDarkContentEnabled != nextLiveWidgetDarkContentEnabled) {\n            runOnMain(() -> {\n                MiuixLauncherStaticGlassHook.onRuntimeWidgetDarkContentChanged(\n                        nextLiveWidgetDarkContentEnabled);\n                MainHook.log("[DC][GlassRuntime] widget dark-content="\n                        + nextLiveWidgetDarkContentEnabled);\n            });\n        }\n''', 1)
          p.write_text(s)

          # Content adapter: TextView-only fallback for standard widgets; native __darkmode for MAML.
          Path('src/main/java/com/hellovoid/liquiddock/LauncherWidgetDarkContentAdapter.java').write_text('''package com.hellovoid.liquiddock;\n\nimport android.content.res.ColorStateList;\nimport android.graphics.Color;\nimport android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.TextView;\n\nimport java.util.Collections;\nimport java.util.Map;\nimport java.util.WeakHashMap;\n\n/** Opt-in content adaptation for widgets rendered over LiquidDock glass. */\nfinal class LauncherWidgetDarkContentAdapter {\n    private static final Map<TextView, ColorStateList> ORIGINAL_TEXT_COLORS =\n            Collections.synchronizedMap(new WeakHashMap<>());\n    private static final Map<View, Double> ORIGINAL_MAML_DARK_MODE =\n            Collections.synchronizedMap(new WeakHashMap<>());\n\n    private LauncherWidgetDarkContentAdapter() {}\n\n    static void apply(View host) {\n        if (host == null) return;\n        if (isMaMlHost(host)) { applyMaml(host); return; }\n        applyTextTree(host);\n    }\n\n    static void release(View host) {\n        if (host == null) return;\n        if (isMaMlHost(host)) {\n            Double original = ORIGINAL_MAML_DARK_MODE.remove(host);\n            if (original != null) {\n                HookUtil.invoke(host, "putVariableNumber", "__darkmode", original);\n                HookUtil.invoke(host, "requestUpdate");\n            }\n            return;\n        }\n        releaseTextTree(host);\n    }\n\n    private static void applyMaml(View host) {\n        if (!ORIGINAL_MAML_DARK_MODE.containsKey(host)) {\n            Object value = HookUtil.invoke(host, "getVariableNumber", "__darkmode");\n            ORIGINAL_MAML_DARK_MODE.put(host, value instanceof Number\n                    ? ((Number) value).doubleValue() : 0.0d);\n        }\n        HookUtil.invoke(host, "putVariableNumber", "__darkmode", 1.0d);\n        HookUtil.invoke(host, "requestUpdate");\n    }\n\n    private static void applyTextTree(View view) {\n        if (view instanceof TextView) {\n            TextView text = (TextView) view;\n            ColorStateList current = text.getTextColors();\n            if (current != null && isDarkNeutral(current.getDefaultColor())) {\n                ORIGINAL_TEXT_COLORS.put(text, current);\n                text.setTextColor(Color.WHITE);\n            } else if (current != null && current.getDefaultColor() != Color.WHITE) {\n                ORIGINAL_TEXT_COLORS.remove(text);\n            }\n        }\n        if (view instanceof ViewGroup) {\n            ViewGroup group = (ViewGroup) view;\n            for (int i = 0; i < group.getChildCount(); i++) applyTextTree(group.getChildAt(i));\n        }\n    }\n\n    private static void releaseTextTree(View view) {\n        if (view instanceof TextView) {\n            TextView text = (TextView) view;\n            ColorStateList original = ORIGINAL_TEXT_COLORS.remove(text);\n            if (original != null) text.setTextColor(original);\n        }\n        if (view instanceof ViewGroup) {\n            ViewGroup group = (ViewGroup) view;\n            for (int i = 0; i < group.getChildCount(); i++) releaseTextTree(group.getChildAt(i));\n        }\n    }\n\n    static boolean isDarkNeutral(int color) {\n        if (Color.alpha(color) == 0) return false;\n        int r = Color.red(color), g = Color.green(color), b = Color.blue(color);\n        int max = Math.max(r, Math.max(g, b));\n        int min = Math.min(r, Math.min(g, b));\n        if (max - min > 36) return false;\n        double luminance = (0.2126d * r + 0.7152d * g + 0.0722d * b) / 255.0d;\n        return luminance <= 0.42d;\n    }\n\n    private static boolean isMaMlHost(View host) {\n        String name = host.getClass().getName();\n        return name.endsWith(".MaMlHostView") || name.contains(".maml.");\n    }\n}\n''')

          # Hook ownership/lifecycle.
          p = Path('src/main/java/com/hellovoid/liquiddock/MiuixLauncherStaticGlassHook.java')
          s = p.read_text()
          old = '''            if (isWidgetHost(host)) LauncherGlassVendorMaterialSuppressor.releaseWidget(host);'''
          new = '''            if (isWidgetHost(host)) {\n                LauncherWidgetDarkContentAdapter.release(host);\n                LauncherGlassVendorMaterialSuppressor.releaseWidget(host);\n            }'''
          if old not in s: raise SystemExit('missing runtime glass release')
          s = s.replace(old, new, 1)
          old = '''            if (!isWidgetHost(host)) continue;\n            LauncherGlassVendorMaterialSuppressor.releaseWidget(host);'''
          new = '''            if (!isWidgetHost(host)) continue;\n            LauncherWidgetDarkContentAdapter.release(host);\n            LauncherGlassVendorMaterialSuppressor.releaseWidget(host);'''
          if old not in s: raise SystemExit('missing widget glass release')
          s = s.replace(old, new, 1)
          marker = '''    static boolean install(ClassLoader classLoader, LiquidDockConfig runtimeConfig) {'''
          addition = '''    static void onRuntimeWidgetDarkContentChanged(boolean enabled) {\n        for (View host : new ArrayList<>(BOOTSTRAP_OBSERVERS.keySet())) {\n            if (!isWidgetHost(host)) continue;\n            if (enabled && host.isAttachedToWindow()\n                    && LauncherGlassHierarchy.isWorkspace(host)) {\n                LauncherWidgetDarkContentAdapter.apply(host);\n            } else {\n                LauncherWidgetDarkContentAdapter.release(host);\n            }\n        }\n    }\n\n'''
          if marker not in s: raise SystemExit('missing install marker')
          s = s.replace(marker, addition + marker, 1)
          old = '''        if (kind == LauncherGlassDragState.Kind.WIDGET && !GlassRuntimeState.isWidgetEnabled()) {\n            LauncherGlassVendorMaterialSuppressor.releaseWidget(host);'''
          new = '''        if (kind == LauncherGlassDragState.Kind.WIDGET && !GlassRuntimeState.isWidgetEnabled()) {\n            LauncherWidgetDarkContentAdapter.release(host);\n            LauncherGlassVendorMaterialSuppressor.releaseWidget(host);'''
          if old not in s: raise SystemExit('missing schedule disabled block')
          s = s.replace(old, new, 1)
          old = '''            if (kind == LauncherGlassDragState.Kind.WIDGET) {\n                LauncherGlassVendorMaterialSuppressor.releaseWidget(host);\n            }'''
          new = '''            if (kind == LauncherGlassDragState.Kind.WIDGET) {\n                LauncherWidgetDarkContentAdapter.release(host);\n                LauncherGlassVendorMaterialSuppressor.releaseWidget(host);\n            }'''
          if old not in s: raise SystemExit('missing domain release block')
          s = s.replace(old, new, 1)
          old = '''            LauncherGlassVendorMaterialSuppressor.claimWidget(host);\n        }'''
          new = '''            LauncherGlassVendorMaterialSuppressor.claimWidget(host);\n            if (GlassRuntimeState.isWidgetDarkContentEnabled()) {\n                LauncherWidgetDarkContentAdapter.apply(host);\n            } else {\n                LauncherWidgetDarkContentAdapter.release(host);\n            }\n        }'''
          if old not in s: raise SystemExit('missing claim block')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Compose switch, directly below widget glass toggle.
          replace('src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt',
              '''        BooleanSetting(prefs, ConfigSchema.Glass.WIDGET_GLASS, "小部件玻璃", "只替换材质背景，保留 RemoteViews / MAML 内容", masterEnabled && liquidGlass) { widgetGlass = it }\n        IntSetting(prefs, widgetSizeOffsetSpec, masterEnabled && liquidGlass && widgetGlass)''',
              '''        BooleanSetting(prefs, ConfigSchema.Glass.WIDGET_GLASS, "小部件玻璃", "只替换材质背景，保留 RemoteViews / MAML 内容", masterEnabled && liquidGlass) { widgetGlass = it }\n        BooleanSetting(prefs, ConfigSchema.Glass.WIDGET_DARK_CONTENT, "小组件深色内容适配", "将深色中性文字转为白色；MAML 优先使用原生深色变量，不处理图片与彩色内容", masterEnabled && liquidGlass && widgetGlass)\n        IntSetting(prefs, widgetSizeOffsetSpec, masterEnabled && liquidGlass && widgetGlass)''')

          # Legacy settings surface.
          replace('src/main/res/xml/preferences.xml',
              '''        <SwitchPreference android:key="liquid_widget_glass" android:title="Widget Glass"\n            android:summary="Shared glass behind widget content" android:defaultValue="true" android:dependency="liquid_glass" />\n        <com.hellovoid.liquiddock.SeekBarPreference android:key="liquid_widget_size_offset"''',
              '''        <SwitchPreference android:key="liquid_widget_glass" android:title="Widget Glass"\n            android:summary="Shared glass behind widget content" android:defaultValue="true" android:dependency="liquid_glass" />\n        <SwitchPreference android:key="liquid_widget_dark_content" android:title="Widget Dark Content Adaptation"\n            android:summary="Convert dark neutral text to white; keep images and colored content unchanged"\n            android:defaultValue="false" android:dependency="liquid_widget_glass" />\n        <com.hellovoid.liquiddock.SeekBarPreference android:key="liquid_widget_size_offset"''')
          PY
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/temp-widget-dark-content-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add widget dark-content adaptation"
          git push origin HEAD:feat/widget-dark-content-adaptation
