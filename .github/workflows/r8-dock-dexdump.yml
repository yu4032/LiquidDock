name: R8 Dock spacing dexdump

on:
  push:
    branches:
      - audit/r8-dock-customization
    paths:
      - .github/workflows/r8-dock-dexdump.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug
      - name: Inspect optimized target-ClassLoader resolution
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find build/outputs/apk/debug -name '*.apk' | head -1)
          MAP=build/outputs/mapping/debug/mapping.txt
          APKA="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          echo '=== mapping ==='
          grep -E '^com\.hellovoid\.liquiddock\.Miuix307MaterialPipeline|^androidx\.recyclerview\.widget\.RecyclerView(\$State)? ' "$MAP" || true
          "$APKA" dex code --class com.hellovoid.liquiddock.Miuix307MaterialPipeline "$APK" > /tmp/material.smali
          echo '=== exact Class.forName / loadClass calls ==='
          grep -n -B12 -A18 -E 'Ljava/lang/Class;->forName|Ljava/lang/ClassLoader;->loadClass|RecyclerView\$State|HotSeatsListContentLayoutManager\$OffsetDecoration' /tmp/material.smali | head -1000 || true
          echo '=== spacing install method ==='
          awk '/\.method .*installDockCustomizationCompatibility/{show=1} show{print} show && /\.end method/{exit}' /tmp/material.smali | head -1000 || true
