name: Apply backdrop continuity patch

on:
  push:
    branches:
      - fix-workspace-glass-backdrop-latency

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: reapply backdrop continuity patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-workspace-glass-backdrop-latency
          fetch-depth: 0
      - name: Apply exact Session patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java')
          text = path.read_text()

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          one('        sceneGeneration = generation;\n        invalidateBackdropFrameState();\n',
              '        sceneGeneration = generation;\n        invalidateBackdropFrameState(\n                LauncherGlassBackdropRetentionPolicy.Invalidation.SCENE_FRESHNESS);\n',
              'scene freshness invalidation')

          one('        // Keep the existing StaticLayer pixels visible while invalidating only the cached source.\n        invalidateBackdropFrameState();\n',
              '        // Keep the prepared StaticLayer backdrop renderable while this source request\n        // becomes stale against sceneGeneration; a fresh OES frame still owns freshness.\n        invalidateBackdropFrameState(\n                LauncherGlassBackdropRetentionPolicy.Invalidation.SCENE_FRESHNESS);\n',
              'wallpaper freshness invalidation')

          one('    private void invalidateBackdropFrameState() {\n        frameAvailable.set(false);\n        consumedGeneration = -1L;\n        backdropPrepared = false;\n    }\n',
              '    private void invalidateBackdropFrameState(\n            LauncherGlassBackdropRetentionPolicy.Invalidation invalidation) {\n        frameAvailable.set(false);\n        if (!LauncherGlassBackdropRetentionPolicy.preservesPreparedBackdrop(invalidation)) {\n            consumedGeneration = -1L;\n            backdropPrepared = false;\n        }\n    }\n',
              'typed backdrop invalidation')

          one('            invalidateBackdropFrameState();\n            MainHook.log(TAG + " producer geometry not coherent with root root="',
              '            invalidateBackdropFrameState(\n                    LauncherGlassBackdropRetentionPolicy.Invalidation.RENDER_DOMAIN);\n            MainHook.log(TAG + " producer geometry not coherent with root root="',
              'incoherent producer geometry')

          one('        if (rotationChanged) beginRotationSettle(nextRotation);\n        invalidateBackdropFrameState();\n        long nextGeneration = LauncherGlassSceneController.invalidateForProducerChange(root);\n',
              '        if (rotationChanged) beginRotationSettle(nextRotation);\n        invalidateBackdropFrameState(\n                LauncherGlassBackdropRetentionPolicy.Invalidation.RENDER_DOMAIN);\n        long nextGeneration = LauncherGlassSceneController.invalidateForProducerChange(root);\n',
              'render domain change')

          one('        inputSurfaceTexture = input;\n        inputProducerSurface = producer;\n        backdropPrepared = false;\n        input.setOnFrameAvailableListener',
              '        inputSurfaceTexture = input;\n        inputProducerSurface = producer;\n        // Source endpoint identity is independent from the already-prepared consumer backdrop.\n        input.setOnFrameAvailableListener',
              'input endpoint cache retention')

          old = '        Miuix307PassBlurBridge.unbind(old);\n        backdropPrepared = false;\n'
          if text.count(old) != 2:
              raise SystemExit(f'rebind cache retention: expected 2 matches, got {text.count(old)}')
          text = text.replace(old, '        Miuix307PassBlurBridge.unbind(old);\n', 2)

          one('        invalidateBackdropFrameState();\n        clearWallpaperRequest();\n',
              '        invalidateBackdropFrameState(\n                LauncherGlassBackdropRetentionPolicy.Invalidation.SOURCE_ENDPOINT);\n        clearWallpaperRequest();\n',
              'endpoint release invalidation')

          one('        rawWidth = 0;\n        rawHeight = 0;\n        backdropPrepared = false;\n',
              '        rawWidth = 0;\n        rawHeight = 0;\n        invalidateBackdropFrameState(\n                LauncherGlassBackdropRetentionPolicy.Invalidation.RENDER_TARGET);\n',
              'render target invalidation')

          if text.count('backdropPrepared = false;') != 2:
              raise SystemExit('unexpected backdropPrepared=false count: '
                               + str(text.count('backdropPrepared = false;')))
          if text.count('invalidateBackdropFrameState();') != 0:
              raise SystemExit('untyped backdrop invalidation remains')

          path.write_text(text)
          PY

          git diff --check
          git add src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'fix: preserve cached backdrop across Recents source recovery'
          git push origin HEAD:fix-workspace-glass-backdrop-latency
