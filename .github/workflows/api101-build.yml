name: Dock producer probe D2 reassert Surface

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dock-producer-d2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Apply D2 producer reassert probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java')
          s = bridge.read_text()
          marker = '''    /** Workspace idle suspension and vendor-snapshot Dock suspension. */\n    static void pauseUpdates(Binding binding) {'''
          method = '''    /** D2 latency probe: reassert the same producer Surface and live-update flag per UI pre-draw. */\n    static void reassertLiveProducer(Binding binding) {\n        if (binding == null || !binding.bound || !binding.rootSurface.isValid()) return;\n        try (SurfaceControl.Transaction transaction = new SurfaceControl.Transaction()) {\n            binding.setPassBlurSurface.invoke(\n                    transaction, binding.rootSurface, binding.producerSurface);\n            binding.setUpdateTextureFlag.invoke(\n                    transaction, binding.rootSurface, Boolean.TRUE, Float.valueOf(binding.scale));\n            transaction.apply();\n            binding.updatesEnabled = true;\n        } catch (Throwable error) {\n            MainHook.log(TAG + \" PassBlur producer reassert failed: \" + error);\n        }\n    }\n\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'D2 bridge marker count={s.count(marker)}')
          s = s.replace(marker, method + marker, 1)
          bridge.write_text(s)

          view = Path('src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java')
          s = view.read_text()
          old = '''        ViewTreeObserver.OnPreDrawListener listener = () -> {\n            refreshProducerGeometryInPlace();\n            updateBackdropMapping();\n            return true;\n        };'''
          new = '''        ViewTreeObserver.OnPreDrawListener listener = () -> {\n            refreshProducerGeometryInPlace();\n            updateBackdropMapping();\n            Miuix307PassBlurBridge.reassertLiveProducer(binding);\n            return true;\n        };'''
          if s.count(old) != 1:
              raise SystemExit(f'D2 preDraw block count={s.count(old)}')
          s = s.replace(old, new, 1)
          view.write_text(s)
          PY
      - name: Audit D2 probe shape
        shell: bash
        run: |
          grep -n 'reassertLiveProducer(binding)' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java
          grep -n 'binding.setPassBlurSurface.invoke' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java
          grep -n 'binding.setUpdateTextureFlag.invoke' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expD2-reassert-surface-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expD2-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
