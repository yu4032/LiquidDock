name: temporary shortcut dark mode cleanup
on:
  push:
    branches:
      - feat/shortcut-menu-white-text
    paths:
      - .github/workflows/_temp_cleanup_shortcut_dark_mode.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shortcut-menu-white-text
      - name: Clean old shortcut dark-mode naming
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          test = Path('src/test/java/com/hellovoid/liquiddock/ShortcutSecondaryGlassContractTest.java')
          text = test.read_text()
          old = 'ShortcutMenuTextColorController.java'
          new = 'ShortcutMenuDarkModeController.java'
          assert old in text
          test.write_text(text.replace(old, new))
          old_controller = Path('src/main/java/com/hellovoid/liquiddock/ShortcutMenuTextColorController.java')
          assert old_controller.exists()
          old_controller.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: remove obsolete shortcut text controller name'
          git push origin HEAD:feat/shortcut-menu-white-text
