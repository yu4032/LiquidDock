name: Apply presentation/dock/label GREEN
on:
  push:
    branches: [feat/widget-dark-content-adaptation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/widget-dark-content-adaptation
      - name: Apply bounded production fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src/main/java/com/hellovoid/liquiddock')

          p=root/'LauncherGlassSceneController.java'; s=p.read_text()
          s=s.replace('    private static boolean vendorFolderCovered;\n', '    private static boolean vendorFolderCovered;\n    private static boolean vendorHomeTransitionPending;\n    private static boolean vendorUnlockTransitionPending;\n')
          s=s.replace('    private boolean recentsCovered;\n', '    private boolean recentsCovered;\n    private boolean homeTransitionPending;\n    private boolean unlockTransitionPending;\n')
          s=s.replace('        created.folderCovered = vendorFolderCovered;\n', '        created.folderCovered = vendorFolderCovered;\n        created.homeTransitionPending = vendorHomeTransitionPending;\n        created.unlockTransitionPending = vendorUnlockTransitionPending;\n')
          anchor='''    static void onWallpaperChangedForAll() {\n'''
          insert='''    static void setHomeTransitionPendingForAll(boolean pending) {\n        ArrayList<LauncherGlassSceneController> snapshot;\n        synchronized (LauncherGlassSceneController.class) {\n            vendorHomeTransitionPending = pending;\n            snapshot = new ArrayList<>(BY_ROOT.values());\n        }\n        for (LauncherGlassSceneController controller : snapshot) {\n            if (controller != null) controller.setHomeTransitionPending(pending);\n        }\n    }\n\n    static void setUnlockTransitionPendingForAll(boolean pending) {\n        ArrayList<LauncherGlassSceneController> snapshot;\n        synchronized (LauncherGlassSceneController.class) {\n            vendorUnlockTransitionPending = pending;\n            snapshot = new ArrayList<>(BY_ROOT.values());\n        }\n        for (LauncherGlassSceneController controller : snapshot) {\n            if (controller != null) controller.setUnlockTransitionPending(pending);\n        }\n    }\n\n'''
          assert anchor in s; s=s.replace(anchor, insert+anchor,1)
          s=s.replace('''        if (layer == null) layer = LauncherGlassStaticLayer.acquire(root, session);\n        applyLayerVisibility();\n''','''        if (layer == null) layer = LauncherGlassStaticLayer.acquire(root, session);\n        applyLayerVisibility();\n        if (isPresentationPending()) session.suspendWorkspaceProducer();\n''',1)
          s=s.replace('''    private void requestFreshBackdrop(long generation) {\n        if (state.state() == State.COVERED || generation != state.generation()) return;\n''','''    private void requestFreshBackdrop(long generation) {\n        if (isPresentationPending()) return;\n        if (state.state() == State.COVERED || generation != state.generation()) return;\n''',1)
          s=s.replace('''    private synchronized void flushDeferredWallpaperPulse() {\n        if (state.state() == State.COVERED || wallpaperPulseInFlight) return;\n''','''    private synchronized void flushDeferredWallpaperPulse() {\n        if (isPresentationPending()) return;\n        if (state.state() == State.COVERED || wallpaperPulseInFlight) return;\n''',1)
          s=s.replace('''    private void setFolderCovered(boolean covered) {\n''','''    private boolean isPresentationPending() {\n        return homeTransitionPending || unlockTransitionPending;\n    }\n\n    private void setHomeTransitionPending(boolean pending) {\n        boolean wasPending = isPresentationPending();\n        homeTransitionPending = pending;\n        onPresentationPendingChanged(wasPending, isPresentationPending(), "home");\n    }\n\n    private void setUnlockTransitionPending(boolean pending) {\n        boolean wasPending = isPresentationPending();\n        unlockTransitionPending = pending;\n        onPresentationPendingChanged(wasPending, isPresentationPending(), "unlock");\n    }\n\n    private void onPresentationPendingChanged(boolean wasPending, boolean pending, String reason) {\n        if (wasPending == pending) return;\n        if (pending) {\n            deferInFlightWallpaperPulse();\n            state.onGenerationInvalidated();\n            applyLayerVisibility();\n            session.suspendWorkspaceProducer();\n            MainHook.log(TAG + " presentation pending reason=" + reason\n                    + " generation=" + state.generation());\n            return;\n        }\n        if (state.state() != State.COVERED && state.state() != State.DETACHED) {\n            MainHook.log(TAG + " presentation settled reason=" + reason\n                    + " generation=" + state.generation());\n            requestFreshBackdrop(state.generation());\n        }\n    }\n\n    private void setFolderCovered(boolean covered) {\n''',1)
          s=s.replace('''        if (state.state() == State.COVERED || wallpaperPulseInFlight) {\n''','''        if (state.state() == State.COVERED || isPresentationPending() || wallpaperPulseInFlight) {\n''',1)
          p.write_text(s)

          p=root/'DockGlassCompositor.java'; s=p.read_text()
          anchor='''    void setWorkstationIconCornerRadiusDp(float radiusDp) {\n        workstationIconCornerRadiusDp = Math.max(0f, radiusDp);\n        seenRevision = -1L;\n        lastFingerprint = Long.MIN_VALUE;\n    }\n'''
          add=anchor+'''\n    void invalidateUiScene() {\n        lastFingerprint = Long.MIN_VALUE;\n        lastOutputFingerprint = Long.MIN_VALUE;\n        for (CachedItem item : cached) item.uiFingerprint = Long.MIN_VALUE;\n    }\n'''
          assert anchor in s; s=s.replace(anchor,add,1); p.write_text(s)

          p=root/'Miuix307PassBlurTextureView.java'; s=p.read_text()
          anchor='''    void setWorkstationDockIconCornerRadiusDp(float radiusDp) {\n        workstationDockIconCornerRadiusDp = Math.max(0f, radiusDp);\n        dockCompositor.setWorkstationIconCornerRadiusDp(workstationDockIconCornerRadiusDp);\n        if (hasConsumedFrame) renderHandler.post(() -> drawLatestFrame(false));\n    }\n'''
          add=anchor+'''\n    void requestDockSceneRefresh() {\n        if (shuttingDown) return;\n        postOnAnimation(() -> {\n            if (shuttingDown) return;\n            dockCompositor.invalidateUiScene();\n            updateBackdropMapping();\n            if (hasConsumedFrame) renderHandler.post(() -> drawLatestFrame(false));\n            postInvalidateOnAnimation();\n        });\n    }\n'''
          assert anchor in s; s=s.replace(anchor,add,1); p.write_text(s)

          p=root/'Miuix307ZeroCopyRenderer.java'; s=p.read_text()
          anchor='''    static void setProducerUpdatesEnabled(boolean enabled, String reason) {\n        Miuix307PassBlurTextureView gpuBackdrop = gpuBackdropRef.get();\n        if (gpuBackdrop != null) gpuBackdrop.setProducerUpdatesEnabled(enabled, reason);\n    }\n'''
          add=anchor+'''\n    static void requestDockSceneRefresh() {\n        Miuix307PassBlurTextureView gpuBackdrop = gpuBackdropRef.get();\n        if (gpuBackdrop != null) gpuBackdrop.requestDockSceneRefresh();\n    }\n'''
          assert anchor in s; s=s.replace(anchor,add,1); p.write_text(s)

          p=root/'ModuleMain.java'; s=p.read_text()
          s=s.replace('''            LauncherGlassRecentsHook.install(classLoader, runtimeConfig);\n''','''            LauncherGlassRecentsHook.install(classLoader, runtimeConfig);\n            LauncherGlassHomePresentationHook.install(classLoader);\n            DockGlassDropRefreshHook.install(classLoader);\n''',1); p.write_text(s)

          manifest=Path('src/main/AndroidManifest.xml'); s=manifest.read_text()
          old='<application\n        android:allowBackup="false"'
          new='<application\n        android:label="@string/app_name"\n        android:allowBackup="false"'
          assert old in s; manifest.write_text(s.replace(old,new,1))

          (root/'LauncherGlassHomePresentationHook.java').write_text('''package com.hellovoid.liquiddock;\n\n/** Gates fresh Workspace capture on real HyperOS 4.50 HOME/unlock presentation completion. */\nfinal class LauncherGlassHomePresentationHook {\n    private static final String TAG = "[DC][GlassScene]";\n    private static final String WINDOW_ELEMENT = "com.miui.home.recents.anim.WindowElement";\n    private static final String CLOSE_TO_HOME = "CLOSE_TO_HOME";\n    private static final String CLOSE_TO_HOME_CENTER = "CLOSE_TO_HOME_CENTER";\n    private static final String UNLOCK_STATE = "com.miui.home.launcher.common.UnlockAnimationStateMachine";\n    private static final String PREPARE = "PREPARE";\n    private static final String PRESENT_CALLBACK = "com.miui.home.launcher.compat.UserPresentAnimationCompatV12Folme$1";\n    private static final String VENDOR_RESET_COUNTER = "resetAnimationViewNum";\n    private static boolean installed;\n    private static boolean homeTransitionArmed;\n    private static boolean unlockTransitionArmed;\n\n    private LauncherGlassHomePresentationHook() {}\n\n    static void install(ClassLoader classLoader) {\n        if (installed) return;\n        hookHome(classLoader);\n        hookUnlock(classLoader);\n        installed = true;\n    }\n\n    private static void hookHome(ClassLoader classLoader) {\n        try {\n            HookUtil.hookMethod(classLoader, WINDOW_ELEMENT, "animTo", chain -> {\n                Object[] args = chain.getArgs().toArray(new Object[0]);\n                if (containsHomeClose(args)) {\n                    homeTransitionArmed = true;\n                    LauncherGlassSceneController.setHomeTransitionPendingForAll(true);\n                }\n                return chain.proceed(args);\n            });\n            HookUtil.hookMethod(classLoader, WINDOW_ELEMENT, "onAnimationEnd", chain -> {\n                Object result = chain.proceed(chain.getArgs().toArray(new Object[0]));\n                if (homeTransitionArmed) {\n                    homeTransitionArmed = false;\n                    LauncherGlassSceneController.setHomeTransitionPendingForAll(false);\n                }\n                return result;\n            });\n            MainHook.log(TAG + " HOME presentation barrier installed");\n        } catch (Throwable error) {\n            MainHook.log(TAG + " HOME presentation barrier unavailable: " + error);\n        }\n    }\n\n    private static boolean containsHomeClose(Object[] args) {\n        if (args == null) return false;\n        for (Object arg : args) {\n            String token = String.valueOf(arg);\n            if (token.contains(CLOSE_TO_HOME_CENTER) || token.contains(CLOSE_TO_HOME)) return true;\n        }\n        return false;\n    }\n\n    private static void hookUnlock(ClassLoader classLoader) {\n        try {\n            HookUtil.hookMethod(classLoader, UNLOCK_STATE, "setState", chain -> {\n                Object[] args = chain.getArgs().toArray(new Object[0]);\n                if (args.length > 0 && PREPARE.equals(String.valueOf(args[0]))) {\n                    unlockTransitionArmed = true;\n                    LauncherGlassSceneController.setUnlockTransitionPendingForAll(true);\n                }\n                return chain.proceed(args);\n            });\n        } catch (Throwable error) {\n            MainHook.log(TAG + " unlock PREPARE barrier unavailable: " + error);\n        }\n        hookUnlockFinish(classLoader, "onComplete");\n        hookUnlockFinish(classLoader, "onCancel");\n    }\n\n    private static void hookUnlockFinish(ClassLoader classLoader, String method) {\n        try {\n            HookUtil.hookMethod(classLoader, PRESENT_CALLBACK, method, chain -> {\n                Object result = chain.proceed(chain.getArgs().toArray(new Object[0]));\n                // The vendor callback updates/resetAnimationViewNum before HOME is fully settled.\n                if (unlockTransitionArmed) {\n                    unlockTransitionArmed = false;\n                    LauncherGlassSceneController.setUnlockTransitionPendingForAll(false);\n                }\n                return result;\n            });\n            MainHook.log(TAG + " unlock presentation " + method + " barrier installed "\n                    + VENDOR_RESET_COUNTER);\n        } catch (Throwable error) {\n            MainHook.log(TAG + " unlock presentation " + method + " unavailable: " + error);\n        }\n    }\n}\n''')

          (root/'DockGlassDropRefreshHook.java').write_text('''package com.hellovoid.liquiddock;\n\n/** Refreshes Dock glass geometry only after HyperOS has committed the final hotseat drop layout. */\nfinal class DockGlassDropRefreshHook {\n    private static final String TAG = "[DC][DockGlass]";\n    private static final String HOTSEATS = "com.miui.home.launcher.hotseats.HotSeatsListContent";\n    private static boolean installed;\n\n    private DockGlassDropRefreshHook() {}\n\n    static void install(ClassLoader classLoader) {\n        if (installed) return;\n        try {\n            HookUtil.hookMethod(classLoader, HOTSEATS, "onDropAnimationFinish", chain -> {\n                Object result = chain.proceed(chain.getArgs().toArray(new Object[0]));\n                Miuix307ZeroCopyRenderer.requestDockSceneRefresh();\n                return result;\n            });\n            installed = true;\n            MainHook.log(TAG + " hotseat drop-finish refresh hook installed");\n        } catch (Throwable error) {\n            MainHook.log(TAG + " hotseat drop-finish refresh hook unavailable: " + error);\n        }\n    }\n}\n''')
          PY
          rm -f .github/workflows/apply-presentation-dock-label-green.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: stabilize workspace capture and dock refresh'
          git push origin HEAD:feat/widget-dark-content-adaptation
