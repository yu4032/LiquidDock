name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: api101-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # PR caches are isolated to refs/pull/*/merge, so let repeated pushes
          # to the same PR reuse branch-specific Gradle/build-cache state.
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
          # The default on-success cleanup starts an extra Gradle invocation and
          # costs ~20-30s on this project. Cache keys are immutable and the repo
          # is small enough that retaining prior entries is preferable here.
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Release R8 shrink verification
        run: ./gradlew minifyReleaseWithR8 --stacktrace
      - name: Show release R8 mapping boundary
        shell: bash
        run: |
          mapping=build/outputs/mapping/release/mapping.txt
          test -s "$mapping"
          echo '--- ModuleMain ---'
          grep -F 'com.hellovoid.liquiddock.ModuleMain ->' "$mapping" || true
          echo '--- SecurityCenterGlassCoordinator ---'
          grep -A80 -F 'com.hellovoid.liquiddock.SecurityCenterGlassCoordinator ->' "$mapping" \
            | grep -E 'SecurityCenterGlassCoordinator ->| scene ->| targetKind ->| currentFrame ->| session ->| turboRef ->|reconcileSinks\(|syncSinksFromMaterials\(|captureFrame\(|hideAndRestoreVendor\(|prepareCustomOwnershipForPresentation\(|requestCurrentGeneration\(' || true
          echo '--- SecurityCenterGlassSession ---'
          grep -A80 -F 'com.hellovoid.liquiddock.SecurityCenterGlassSession ->' "$mapping" \
            | grep -E 'SecurityCenterGlassSession ->| sourceBackend ->' || true
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-release-r8-mapping
          path: build/outputs/mapping/release
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-build-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
