name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply device glass experiment
        run: |
          python3 ci/glass_device_prep.py
          python3 ci/glass_device_fix.py
          python3 ci/glass_main_dock_post.py
          sed -i 's/runtimeDefault()/runtimeFallback()/g' src/main/java/com/hellovoid/liquiddock/GlassRuntimeState.java
          python3 ci/glass_main_dock_contracts.py
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-device-glass-patched-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/main/kotlin/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
          if-no-files-found: error
          retention-days: 3
