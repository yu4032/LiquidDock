name: PassBlur ConfigSchema GREEN

on:
  push:
    branches:
      - experiment/passblur-quality-controls

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/passblur-quality-controls
          fetch-depth: 0
      - name: Register PassBlur quality config keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java')
          s = p.read_text()
          needle = '''        public static final ConfigKey<Integer> CAPTURE_SCALE = integer(\n                "liquid_capture_scale", 50, 50, 50, 10, 100, ConfigKey.ExportMode.ALWAYS);\n'''
          insert = needle + '''        public static final ConfigKey<Integer> PASSBLUR_CAPTURE_SCALE = integer(\n                PassBlurQualityKeys.CAPTURE_SCALE,\n                PassBlurQualityKeys.CAPTURE_SCALE_DEFAULT,\n                PassBlurQualityKeys.CAPTURE_SCALE_DEFAULT,\n                PassBlurQualityKeys.CAPTURE_SCALE_DEFAULT,\n                PassBlurQualityKeys.CAPTURE_SCALE_MIN, PassBlurQualityKeys.CAPTURE_SCALE_MAX,\n                ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Integer> PASSBLUR_RENDER_FPS = integer(\n                PassBlurQualityKeys.RENDER_FPS,\n                PassBlurQualityKeys.RENDER_FPS_DEFAULT,\n                PassBlurQualityKeys.RENDER_FPS_DEFAULT,\n                PassBlurQualityKeys.RENDER_FPS_DEFAULT,\n                PassBlurQualityKeys.RENDER_FPS_MIN, PassBlurQualityKeys.RENDER_FPS_MAX,\n                ConfigKey.ExportMode.ALWAYS);\n'''
          if 'PASSBLUR_CAPTURE_SCALE' not in s:
              if needle not in s:
                  raise SystemExit('ConfigSchema capture scale anchor missing')
              s = s.replace(needle, insert, 1)
          reg = '''                Glass.CAPTURE_SCALE, Glass.DYNAMIC_APP_CAPTURE, Glass.FULLSCREEN_CAPTURE,\n'''
          reg2 = '''                Glass.CAPTURE_SCALE, Glass.PASSBLUR_CAPTURE_SCALE,\n                Glass.PASSBLUR_RENDER_FPS, Glass.DYNAMIC_APP_CAPTURE, Glass.FULLSCREEN_CAPTURE,\n'''
          if 'Glass.PASSBLUR_CAPTURE_SCALE' not in s:
              if reg not in s:
                  raise SystemExit('ConfigSchema registration anchor missing')
              s = s.replace(reg, reg2, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/passblur-configschema-green.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java
          git commit -m "feat: register PassBlur quality preferences"
          git push origin HEAD:experiment/passblur-quality-controls
