name: Structurally format Gboard bottom docking once

on:
  push:
    branches:
      - feat/gboard-disable-bottom-docking
    paths:
      - .github/workflows/format-gboard-bottom-docking-v2-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gboard-disable-bottom-docking
      - name: Format switch structurally
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/kotlin/com/hellovoid/liquiddock/GboardSettingsPages.kt')
          text = path.read_text()

          def matching(s, open_pos):
              depth = 0
              quote = None
              escaped = False
              for i in range(open_pos, len(s)):
                  ch = s[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError('unmatched parenthesis')

          marker = 'checked = bottomDockingEnabled'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one bottom docking switch, got {text.count(marker)}')
          checked = text.index(marker)
          begin = text.rfind('SwitchPreference(', 0, checked)
          line_start = text.rfind('\n', 0, begin) + 1
          paren = begin + len('SwitchPreference')
          close = matching(text, paren)

          i16 = ' ' * 16
          i20 = ' ' * 20
          i24 = ' ' * 24
          i28 = ' ' * 28
          block = '\n'.join([
              i16 + 'SwitchPreference(',
              i20 + 'checked = bottomDockingEnabled,',
              i20 + 'onCheckedChange = {',
              i24 + 'bottomDockingEnabled = it',
              i24 + 'prefs.edit()',
              i28 + '.putBoolean(GboardGlassPreferences.BOTTOM_DOCKING_KEY, it)',
              i28 + '.apply()',
              i20 + '},',
              i20 + 'title = "拖到底部切换为全尺寸键盘",',
              i20 + 'summary = "关闭后，悬浮键盘进入底部区域时不触发震动、Dock 提示动画或全尺寸键盘切换",',
              i20 + 'enabled = masterEnabled,',
              i16 + ')',
          ])
          text = text[:line_start] + block + text[close + 1:]
          path.write_text(text)
          PY
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/kotlin/com/hellovoid/liquiddock/GboardSettingsPages.kt
          git commit -m "style: normalize Gboard bottom docking switch"
          git push origin HEAD:feat/gboard-disable-bottom-docking
