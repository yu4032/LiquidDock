name: One-shot MAML atomic claim applicator

on:
  push:
    branches:
      - refactor/pure-runtime-state-tests
    paths:
      - .github/scripts/apply_maml_atomic_claim_state.py
      - .github/workflows/one-shot-maml-atomic-claim.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pure-runtime-state-tests
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_maml_atomic_claim_state.py
      - run: git diff --check
      - name: Commit generated MAML wiring and remove applicator
        run: |
          rm .github/scripts/apply_maml_atomic_claim_state.py
          rm .github/workflows/one-shot-maml-atomic-claim.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/LauncherMamlBackgroundRuleExecutor.java \
                  src/main/java/com/hellovoid/liquiddock/LauncherWidgetComponentSelectionExecutor.java \
                  .github/scripts/apply_maml_atomic_claim_state.py \
                  .github/workflows/one-shot-maml-atomic-claim.yml
          git commit -m "refactor: route MAML ownership through atomic claim state"
          git push origin HEAD:refactor/pure-runtime-state-tests
