name: OS4 soft edge shader gate one-shot

on:
  push:
    branches:
      - port/os4-original-background-edge
    paths:
      - scripts/apply_os4_soft_edge_shader_gate.py
      - .github/workflows/os4-soft-edge-shader-gate-one-shot.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/os4-original-background-edge
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply exact OS4 shader-gate patch
        run: python3 scripts/apply_os4_soft_edge_shader_gate.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Focused runtime mode propagation
        run: ./gradlew :testDebugUnitTest --tests com.hellovoid.liquiddock.Os4EdgeModePolicyTest --stacktrace
      - name: Focused Prismal shader gate contracts
        run: ./gradlew :prismal:testDebugUnitTest --tests com.hellovoid.prismal.PrismalOs4HighlightGateContractTest --stacktrace
      - name: Full verification before commit
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Commit verified production patch and self-delete
        run: |
          rm -f scripts/apply_os4_soft_edge_shader_gate.py .github/workflows/os4-soft-edge-shader-gate-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: gate OS4 soft edge independently"
          git push origin HEAD:port/os4-original-background-edge
