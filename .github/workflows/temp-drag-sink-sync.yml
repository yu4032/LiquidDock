name: temp drag sink sync

on:
  push:
    branches:
      - fix/folder-drag-workspace-glass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/folder-drag-workspace-glass
          fetch-depth: 0
      - name: Apply drag sink frame sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hellovoid/liquiddock/LauncherGlassDragOverlay.java')
          s = p.read_text()
          old = '''        sink.setNativeCornerRadiusPx(LauncherGlassBoundsPolicy.capRadius(
                activeCornerRadiusPx * radiusScale,
                geometry.visualWidth(), geometry.visualHeight()));
        publishFrameGeometry();
'''
          new = '''        sink.setNativeCornerRadiusPx(LauncherGlassBoundsPolicy.capRadius(
                activeCornerRadiusPx * radiusScale,
                geometry.visualWidth(), geometry.visualHeight()));
        // The sink is a sibling of the carrier, not its child. Moving the carrier does not
        // move the TextureView automatically, so publish the carrier transform to the sink on
        // every Choreographer drag frame before capturing/rendering its crop geometry.
        sink.syncFromMaterial();
        publishFrameGeometry();
'''
          if old not in s:
              raise SystemExit('applyCarrierGeometry anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/LauncherGlassDragOverlay.java
          git commit -m "fix: sync drag glass surface every frame"
          git push origin HEAD:fix/folder-drag-workspace-glass
