name: Apply Launcher 4.50 icon size patch

on:
  push:
    branches:
      - feature/launcher450-icon-size-v2
    paths:
      - .github/workflows/apply-launcher450-icon-size.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/launcher450-icon-size-v2
      - name: Apply patch
        run: python3 .github/scripts/apply_launcher450_icon_size.py
      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java \
                  src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java \
                  src/main/java/com/hellovoid/liquiddock/ModuleMain.java \
                  src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt \
                  src/test/java/com/hellovoid/liquiddock/RuntimeBehaviorTestPolicyContractTest.java
          git diff --cached --check
          git commit -m "feat: wire Launcher 4.50 icon size control"
          git push origin HEAD:feature/launcher450-icon-size-v2
