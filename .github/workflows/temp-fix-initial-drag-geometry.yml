name: temp fix initial drag geometry

on:
  push:
    branches:
      - fix/folder-drag-workspace-glass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/folder-drag-workspace-glass
          fetch-depth: 0
      - name: Apply geometry initialization fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java')
          s = p.read_text()
          old = '            if (!rootGeometryChanged && !localChanged) continue;\n'
          new = '            if (!rootGeometryChanged && !localChanged && node.geometry != null) continue;\n'
          if old not in s:
              raise SystemExit('target geometry guard not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java
          git commit -m 'fix: initialize drag sink geometry on registration'
          git push origin HEAD:fix/folder-drag-workspace-glass
