name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - feat/recents-capsule-glass
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api101-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-shot Recents schema registration
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/recents-capsule-glass'
        shell: bash
        run: |
          python tools/register_recents_capsule_key.py
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java
            git commit -m 'fix: register Recents capsule glass preference'
            git push origin HEAD:feat/recents-capsule-glass
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-build-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
