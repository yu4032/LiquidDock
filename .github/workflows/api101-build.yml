name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply vendor-state Dock mapping fix
        run: |
          python3 ci/vendor_state_dock_fix.py
          python3 ci/workspace_covered_bind_fix.py
          python3 ci/vendor_snapshot_power_fix.py
          python3 ci/workspace_page_glass_fix.py
          python3 ci/workspace_resume_glass_fix.py
          python3 ci/workspace_scene_owner_fix.py
          python3 ci/workspace_proxy_rect_owner_fix.py
          python3 ci/workspace_final_proxy_consumer_fix.py
          python3 ci/workspace_hidden_proxy_visibility_fix.py
          python3 ci/workspace_surface_generation_recovery_fix.py
          python3 ci/workspace_native_surface_generation_fix.py
          python3 ci/workspace_producer_endpoint_rollover_fix.py
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-vendor-state-dock-patched-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
          if-no-files-found: error
          retention-days: 3
