name: Apply inline OES drain patch

on:
  push:
    branches: [ fix-workspace-glass-backdrop-latency ]
    paths:
      - '.github/workflows/apply-inline-oes-drain.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-workspace-glass-backdrop-latency
          fetch-depth: 0

      - name: Patch source-frame dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java')
          text = path.read_text()
          old = '''            if (shouldRender || frameAvailable.get()) {
              frameAvailable.set(true);
              if (shouldRender) requestFrame(false);
              return;
          }
'''
          # Match the repository's actual indentation exactly if the first form is absent.
          if old not in text:
              old = '''            if (shouldRender || frameAvailable.get()) {
                frameAvailable.set(true);
                if (shouldRender) requestFrame(false);
                return;
            }
'''
          if old not in text:
              raise SystemExit('source-frame dispatch anchor not found')
          new = '''            if (shouldRender || frameAvailable.get()) {
                frameAvailable.set(true);
                if (shouldRender) {
                    // SurfaceTexture invokes this listener on renderHandler already. Consume the
                    // newest source now instead of adding another queue turn before updateTexImage.
                    framePolicy.request(false);
                    drainFrameWork();
                }
                return;
            }
'''
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff --exit-code -- src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java >/dev/null && {
            echo 'LauncherGlassSession.java was not modified' >&2
            exit 1
          }

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java
          git commit -m 'fix: drain OES source frame inline'
          git push origin HEAD:fix-workspace-glass-backdrop-latency
