name: Apply workspace static geometry patch

on:
  push:
    branches: [ fix-workspace-glass-edge-clipping ]
    paths:
      - .github/workflows/edge-static-geometry-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-workspace-glass-edge-clipping
          fetch-depth: 0
      - name: Patch static call sites exactly
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/main/java/com/hellovoid/liquiddock/LauncherGlassStaticNode.java
          before=$(grep -F -c 'LauncherGlassGeometry.resolve(' "$FILE")
          test "$before" -eq 2
          sed -i 's/LauncherGlassGeometry\.resolve(/LauncherGlassGeometry.resolveStatic(/g' "$FILE"
          after=$(grep -F -c 'LauncherGlassGeometry.resolveStatic(' "$FILE")
          test "$after" -eq 2
          test "$(grep -F -c 'LauncherGlassGeometry.resolve(' "$FILE" || true)" -eq 0
          rm .github/workflows/edge-static-geometry-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$FILE" .github/workflows/edge-static-geometry-once.yml
          git commit -m 'fix: use full geometry for workspace static glass'
          git push origin HEAD:fix-workspace-glass-edge-clipping
