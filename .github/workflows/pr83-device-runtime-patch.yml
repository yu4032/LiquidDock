name: PR83 device runtime patch

on:
  push:
    branches:
      - fix/450-workstation-stroke-widget-backgrounds

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/450-workstation-stroke-widget-backgrounds
          fetch-depth: 1
      - name: Apply verified device-runtime patch
        shell: bash
        run: |
          cat > /tmp/device-runtime.patch.gz.b64 <<'B64'

B64
          base64 -d /tmp/device-runtime.patch.gz.b64 | gzip -d > /tmp/device-runtime.patch
          git apply --check /tmp/device-runtime.patch
          git apply /tmp/device-runtime.patch
          git diff --check
      - name: Commit runtime fixes and self-delete
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr83-device-runtime-patch.yml
          git add src/main/java/com/hellovoid/liquiddock
          git commit -m "fix: align PR83 with Launcher 4.50 device runtime"
          git push origin HEAD:fix/450-workstation-stroke-widget-backgrounds
