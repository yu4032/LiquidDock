name: One-shot zero-copy recovery applicator

on:
  push:
    branches:
      - refactor/pure-runtime-state-tests

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pure-runtime-state-tests
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_zero_copy_recovery.py
      - run: git diff --check
      - name: Commit generated production wiring and remove applicator
        run: |
          rm .github/scripts/apply_zero_copy_recovery.py
          rm .github/workflows/one-shot-zero-copy-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: consume zero-copy recovery state"
          git push origin HEAD:refactor/pure-runtime-state-tests
