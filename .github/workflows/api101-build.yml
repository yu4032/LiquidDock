name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: api101-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Apply experiment B - direct SurfaceView EGL output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java')
          s = p.read_text()

          def one(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'experiment B patch point missing: {label}')
              s = s.replace(old, new, 1)

          one('import android.graphics.Point;\n', 'import android.graphics.Point;\nimport android.graphics.PixelFormat;\n', 'PixelFormat import')
          one('import android.view.Surface;\n', 'import android.view.Surface;\nimport android.view.SurfaceHolder;\nimport android.view.SurfaceView;\n', 'SurfaceView imports')
          one('''final class Miuix307PassBlurTextureView extends TextureView\n        implements TextureView.SurfaceTextureListener {''',
              '''final class Miuix307PassBlurTextureView extends SurfaceView\n        implements SurfaceHolder.Callback {''', 'class declaration')
          one('''        setOpaque(false);\n        setSurfaceTextureListener(this);\n        setClickable(false);''',
              '''        setZOrderMediaOverlay(true);\n        getHolder().setFormat(PixelFormat.TRANSLUCENT);\n        getHolder().addCallback(this);\n        setClickable(false);''', 'constructor output setup')
          one('''        if (isAvailable() && getSurfaceTexture() != null && outputWindowSurface == null) {\n            onSurfaceTextureAvailable(getSurfaceTexture(), getWidth(), getHeight());\n        }''',
              '''        Surface holderSurface = getHolder().getSurface();\n        if (holderSurface != null && holderSurface.isValid() && outputWindowSurface == null) {\n            surfaceCreated(getHolder());\n        }''', 'attached callback')

          start = s.index('''    @Override\n    public void onSurfaceTextureAvailable''')
          end_marker = '''    private void attachOutputWindow'''
          end = s.index(end_marker, start)
          lifecycle = '''    @Override\n    public void surfaceCreated(SurfaceHolder holder) {\n        Surface surface = holder != null ? holder.getSurface() : null;\n        if (shuttingDown || surface == null || !surface.isValid()) return;\n        outputWidth = Math.max(1, getWidth());\n        outputHeight = Math.max(1, getHeight());\n        hasPresentedFrame = false;\n        updateBackdropMapping();\n        Surface stale = outputWindowSurface;\n        outputWindowSurface = surface;\n        MainHook.log(TAG + " [LatencyExpB] SurfaceView surfaceCreated size="\n                + outputWidth + "x" + outputHeight);\n        renderHandler.post(() -> attachOutputWindow(stale, surface, outputWidth, outputHeight));\n    }\n\n    @Override\n    public void surfaceChanged(SurfaceHolder holder, int format, int width, int height) {\n        if (shuttingDown || holder == null || holder.getSurface() != outputWindowSurface) return;\n        outputWidth = Math.max(1, width);\n        outputHeight = Math.max(1, height);\n        hasPresentedFrame = false;\n        updateBackdropMapping();\n        renderHandler.post(() -> {\n            if (eglWindowSurface == EGL14.EGL_NO_SURFACE) return;\n            try {\n                makeCurrent();\n                ensureFboSize(outputWidth, outputHeight);\n                drawLatestFrame(false);\n            } catch (Throwable error) {\n                fail("output resize", error);\n            }\n        });\n    }\n\n    @Override\n    public void surfaceDestroyed(SurfaceHolder holder) {\n        Surface stale = outputWindowSurface;\n        outputWindowSurface = null;\n        outputWidth = 0;\n        outputHeight = 0;\n        if (stale != null) renderHandler.post(() -> destroyOutputWindow(stale));\n    }\n\n'''
          s = s[:start] + lifecycle + s[end:]

          old_destroy = '''    private void destroyOutputWindow(Surface stale) {\n        try {\n            destroyEglWindowSurfaceOnly();\n        } catch (Throwable error) {\n            MainHook.log(TAG + " output EGL surface destroy failed: " + error);\n        }\n        try {\n            if (stale != null) stale.release();\n        } catch (Throwable ignored) {}\n    }'''
          new_destroy = '''    private void destroyOutputWindow(Surface stale) {\n        try {\n            destroyEglWindowSurfaceOnly();\n        } catch (Throwable error) {\n            MainHook.log(TAG + " output EGL surface destroy failed: " + error);\n        }\n        // SurfaceView owns holder.getSurface(); do not release the managed Surface object here.\n    }'''
          one(old_destroy, new_destroy, 'managed Surface destroy')

          one('''            makeCurrent();\n            queryMaxTextureSize();''',
              '''            makeCurrent();\n            boolean swap0 = EGL14.eglSwapInterval(eglDisplay, 0);\n            MainHook.log(TAG + " [LatencyExpB] eglSwapInterval(0)=" + swap0);\n            queryMaxTextureSize();''', 'swap interval')

          one('''                || !isAttachedToWindow() || !isAvailable()''',
              '''                || !isAttachedToWindow() || getHolder().getSurface() == null\n                || !getHolder().getSurface().isValid()''', 'SurfaceView availability gate')

          p.write_text(s)

          z = Path('src/main/java/com/hellovoid/liquiddock/Miuix307ZeroCopyRenderer.java')
          zs = z.read_text()
          old = '''    private static long readOutputTimestamp(Miuix307PassBlurTextureView gpuBackdrop) {\n        try {\n            SurfaceTexture output = gpuBackdrop.getSurfaceTexture();\n            return output != null ? output.getTimestamp() : 0L;\n        } catch (Throwable ignored) {\n            return 0L;\n        }\n    }'''
          new = '''    private static long readOutputTimestamp(Miuix307PassBlurTextureView gpuBackdrop) {\n        // SurfaceView has no consumer SurfaceTexture timestamp; experiment B intentionally\n        // bypasses that consumer stage, so output timestamp tracing is unavailable here.\n        return 0L;\n    }'''
          if old not in zs:
              raise SystemExit('experiment B ZeroCopyRenderer timestamp patch point missing')
          z.write_text(zs.replace(old, new, 1))
          PY
          grep -nE 'LatencyExpB|extends SurfaceView|surfaceCreated|SurfaceView has no consumer' \
            src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java \
            src/main/java/com/hellovoid/liquiddock/Miuix307ZeroCopyRenderer.java | head -30
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expB-surfaceview-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expB-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
