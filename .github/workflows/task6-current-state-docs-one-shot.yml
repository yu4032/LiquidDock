name: Task6 current-state docs one-shot

on:
  push:
    branches:
      - refactor/technical-debt-cleanup-phase1
    paths:
      - '.github/workflows/task6-current-state-docs-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/technical-debt-cleanup-phase1
          fetch-depth: 0

      - name: Apply exact current-state doc patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/task6_patch.py
          python3 /tmp/task6_patch.py
          git diff --check
          git diff -- TODO.md ARCHITECTURE.md HOOKS.md CONTRIBUTING.md

      - name: Commit docs and self-delete
        shell: bash
        run: |
          rm .github/workflows/task6-current-state-docs-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md ARCHITECTURE.md HOOKS.md CONTRIBUTING.md .github/workflows/task6-current-state-docs-one-shot.yml
          git commit -m 'docs: align phase 1 current state'
          git push origin HEAD:refactor/technical-debt-cleanup-phase1
