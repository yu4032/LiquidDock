name: Task6 smoke record one-shot

on:
  push:
    branches:
      - refactor/technical-debt-cleanup-phase1
    paths:
      - '.github/workflows/task6-smoke-record-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/technical-debt-cleanup-phase1
          fetch-depth: 0

      - name: Record device smoke evidence
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git diff --check

      - name: Commit record and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/task6-smoke-record-one-shot.yml
          git add docs/superpowers/verification/2026-09-07-technical-debt-cleanup-phase1.md
          git commit -m 'docs: record phase 1 device smoke evidence'
          git push origin HEAD:refactor/technical-debt-cleanup-phase1
