name: Task6 current-state docs one-shot

on:
  push:
    branches:
      - refactor/technical-debt-cleanup-phase1
    paths:
      - '.github/workflows/task6-current-state-docs-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/technical-debt-cleanup-phase1
          fetch-depth: 0

      - name: Update current-state docs exactly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}\n--- OLD ---\n{old}")
              p.write_text(text.replace(old, new, 1))

