name: Temporary SideSlideHold GUI patch

on:
  push:
    branches:
      - feat/launcher450-side-slide-hold

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/launcher450-side-slide-hold
      - name: Patch Home settings card
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt')
          text = p.read_text()
          old = '        item { SettingsCard { BooleanSetting(prefs, ConfigSchema.Core.ENABLED, stringResource(R.string.enable_liquiddock), stringResource(R.string.enable_liquiddock_summary)) { onMasterChanged(it) } } }'
          new = '''        item {
              SettingsCard {
                  BooleanSetting(prefs, ConfigSchema.Core.ENABLED, stringResource(R.string.enable_liquiddock), stringResource(R.string.enable_liquiddock_summary)) { onMasterChanged(it) }
                  SideSlideHoldSetting(prefs, masterEnabled)
              }
          }'''
          if old not in text:
              raise SystemExit('Home master card anchor not found')
          p.write_text(text.replace(old, new, 1))

          legacy = Path('src/main/res/xml/preferences.xml')
          legacy_text = legacy.read_text()
          anchor = '<PreferenceScreen xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:app="http://schemas.android.com/apk/res-auto">\n'
          switch = '''\n    <PreferenceCategory android:title="Launcher 4.50 Gestures">\n        <SwitchPreference\n            android:key="launcher450_side_slide_hold"\n            android:title="Side-swipe hold to open Sidebar"\n            android:summary="Hold a completed Back swipe for about 600 ms, then release to open the Security Center Sidebar; restart Launcher and Security Center after changing"\n            android:defaultValue="false" />\n    </PreferenceCategory>\n'''
          if anchor not in legacy_text:
              raise SystemExit('legacy preference anchor not found')
          if 'android:key="launcher450_side_slide_hold"' not in legacy_text:
              legacy.write_text(legacy_text.replace(anchor, anchor + switch, 1))
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-side-slide-gui-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add side slide hold GUI switch"
          git push origin HEAD:feat/launcher450-side-slide-hold
