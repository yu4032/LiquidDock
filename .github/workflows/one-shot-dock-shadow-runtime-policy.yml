name: One-shot dock shadow runtime policy wiring

on:
  push:
    branches:
      - refactor/pure-runtime-state-tests
    paths:
      - .github/workflows/one-shot-dock-shadow-runtime-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pure-runtime-state-tests
          fetch-depth: 0
      - name: Apply exact replacements
        run: python3 scripts/apply-dock-shadow-runtime-policy.py
      - name: Validate patch
        run: git diff --check
      - name: Commit production wiring and self-delete applicator
        run: |
          rm .github/workflows/one-shot-dock-shadow-runtime-policy.yml
          rm scripts/apply-dock-shadow-runtime-policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consume dock shadow runtime policy"
          git push origin HEAD:refactor/pure-runtime-state-tests
