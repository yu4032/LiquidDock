name: Complete functional Dock glass

on:
  push:
    branches:
      - fix/launcher450-folder-inner-icon-size
    paths:
      - .github/workflows/complete-functional-dock-glass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launcher450-folder-inner-icon-size
      - name: Apply audited runtime patch
        run: python3 .github/scripts/complete_functional_dock_glass.py
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/MiuixLauncherStaticGlassHook.java src/main/java/com/hellovoid/liquiddock/DockIconAnimationGlassHook.java
          git diff --cached --check
          git commit -m "fix: complete functional Dock glass runtime wiring"
          git push origin HEAD:fix/launcher450-folder-inner-icon-size
