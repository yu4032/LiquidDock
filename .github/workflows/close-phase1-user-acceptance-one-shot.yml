name: Close Phase 1 user acceptance one-shot

on:
  push:
    branches:
      - refactor/technical-debt-cleanup-phase1
    paths:
      - '.github/workflows/close-phase1-user-acceptance-one-shot.yml'
      - 'scripts/close_phase1_user_acceptance.py'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/technical-debt-cleanup-phase1
          fetch-depth: 0

      - name: Apply closure record
        run: |
          python3 scripts/close_phase1_user_acceptance.py
          git diff --check

      - name: Commit closure and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/close-phase1-user-acceptance-one-shot.yml scripts/close_phase1_user_acceptance.py
          git add TODO.md docs/superpowers/verification/2026-09-07-technical-debt-cleanup-phase1.md
          git commit -m 'docs: close technical debt cleanup phase 1'
          git push origin HEAD:refactor/technical-debt-cleanup-phase1
