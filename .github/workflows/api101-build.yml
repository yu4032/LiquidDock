name: Dock PassBlur force-refresh probe

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dock-force-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Apply E1 native force-refresh probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java')
          s = p.read_text()
          old = '''            Method setMiBlurWinExc = transactionClass.getMethod(\n                    "setMiBlurWinExc", SurfaceControl.class, String[].class);\n'''
          new = '''            Method setMiBlurWinExc = transactionClass.getMethod(\n                    "setMiBlurWinExc", SurfaceControl.class, String[].class);\n            Method setForceRefresh = null;\n            try {\n                setForceRefresh = transactionClass.getMethod(\n                        "setForceRefresh", SurfaceControl.class, Integer.TYPE);\n            } catch (NoSuchMethodException unavailable) {\n                MainHook.log(TAG + " vendor setForceRefresh unavailable");\n            }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'force-refresh method insertion match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old2 = '''                setUpdateTextureFlag.invoke(\n                        transaction, rootSurface, Boolean.TRUE, Float.valueOf(scale));\n                transaction.apply();\n'''
          new2 = '''                setUpdateTextureFlag.invoke(\n                        transaction, rootSurface, Boolean.TRUE, Float.valueOf(scale));\n                int forceRefreshMs = PassBlurForceRefreshPolicy.timeoutMs(domain);\n                if (forceRefreshMs >= 0 && setForceRefresh != null) {\n                    try {\n                        setForceRefresh.invoke(\n                                transaction, rootSurface, Integer.valueOf(forceRefreshMs));\n                        MainHook.log(TAG + " PassBlur force-refresh armed ms=" + forceRefreshMs\n                                + " domain=" + domain);\n                    } catch (Throwable forceError) {\n                        MainHook.log(TAG + " PassBlur force-refresh unavailable: " + forceError);\n                    }\n                }\n                transaction.apply();\n'''
          if s.count(old2) != 1:
              raise SystemExit(f'force-refresh transaction insertion match count={s.count(old2)}')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Audit force-refresh probe shape
        shell: bash
        run: |
          grep -n 'setForceRefresh' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java
          grep -n 'PassBlurForceRefreshPolicy.timeoutMs(domain)' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java
          grep -n 'Integer.valueOf(forceRefreshMs)' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expE1-force-refresh-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expE1-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
