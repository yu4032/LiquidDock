name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply Glass Scene production patch
        run: python3 ci/glass_scene_runner.py
      - name: Apply Glass performance patch
        run: python3 ci/glass_perf_runner.py
      - name: Apply idle Workspace and continuous Dock fix
        run: python3 ci/glass_idle_dock_fix.py
      - name: Update Scheme A regression contracts
        run: python3 ci/glass_contract_compact.py
      - name: Capture patched sources
        if: always()
        run: |
          mkdir -p build/glass-scene-verified
          git diff -- src/main > build/glass-scene-verified/glass-scene.patch
          cp -a src/main build/glass-scene-verified/src-main
      - name: Upload patched sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-glass-scene-patched-source
          path: build/glass-scene-verified
          retention-days: 7
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep the same Gradle verification gates on main and active API101 development branches.
