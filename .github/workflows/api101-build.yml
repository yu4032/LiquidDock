name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: api101-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # PR caches are isolated to refs/pull/*/merge, so let repeated pushes
          # to the same PR reuse branch-specific Gradle/build-cache state.
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
          # The default on-success cleanup starts an extra Gradle invocation and
          # costs ~20-30s on this project. Cache keys are immutable and the repo
          # is small enough that retaining prior entries is preferable here.
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Release R8 shrink verification
        run: ./gradlew minifyReleaseWithR8 --stacktrace
      - name: Audit release R8 reflection boundary
        shell: bash
        run: |
          mapping=build/outputs/mapping/release/mapping.txt
          test -s "$mapping"
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("build/outputs/mapping/release/mapping.txt").read_text(
              encoding="utf-8", errors="replace").splitlines()

          def section(class_name):
              prefix = class_name + " -> "
              start = next((i for i, line in enumerate(lines) if line.startswith(prefix)), None)
              if start is None:
                  raise SystemExit(f"missing release mapping class: {class_name}")
              end = start + 1
              while end < len(lines) and (lines[end].startswith("    ") or lines[end].startswith("#")):
                  end += 1
              return lines[start:end]

          module = section("com.hellovoid.liquiddock.ModuleMain")
          if module[0] != (
              "com.hellovoid.liquiddock.ModuleMain -> "
              "com.hellovoid.liquiddock.ModuleMain:"
          ):
              raise SystemExit("ModuleMain literal Xposed entry was renamed by release R8")

          coordinator = section(
              "com.hellovoid.liquiddock.SecurityCenterGlassCoordinator")
          session = section("com.hellovoid.liquiddock.SecurityCenterGlassSession")

          required = {
              "scene": "com.hellovoid.liquiddock.SecurityCenterGlassSceneState scene",
              "targetKind": (
                  "com.hellovoid.liquiddock.SecurityCenterGlassSceneState$Target targetKind"),
              "currentFrame": (
                  "com.hellovoid.liquiddock.SecurityCenterGlassFrameGeometry currentFrame"),
              "session": "com.hellovoid.liquiddock.SecurityCenterGlassSession session",
              "turboRef": "java.lang.ref.WeakReference turboRef",
              "reconcileSinks": "void reconcileSinks()",
              "syncSinksFromMaterials": "boolean syncSinksFromMaterials()",
              "captureFrame": (
                  "com.hellovoid.liquiddock.SecurityCenterGlassFrameGeometry captureFrame(boolean)"),
              "hideAndRestoreVendor": "void hideAndRestoreVendor()",
              "prepareCustomOwnershipForPresentation": (
                  "void prepareCustomOwnershipForPresentation()"),
              "requestCurrentGeneration": (
                  "void requestCurrentGeneration("
                  "com.hellovoid.liquiddock.SecurityCenterGlassFrameGeometry)"),
          }

          def require_preserved(block, source_signature, final_name):
              for line in block:
                  if source_signature in line and " -> " in line:
                      if line.rsplit(" -> ", 1)[1].strip() == final_name:
                          return
              raise SystemExit(
                  f"release R8 did not preserve reflected member {source_signature} -> {final_name}")

          for final_name, source_signature in required.items():
              require_preserved(coordinator, source_signature, final_name)
          require_preserved(
              session,
              "com.hellovoid.liquiddock.RootPassBlurBackend sourceBackend",
              "sourceBackend")

          print("release R8 reflection boundary: 12/12 reflected members preserved")
          print(module[0])
          print(coordinator[0])
          print(session[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-release-r8-mapping
          path: build/outputs/mapping/release
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-build-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
