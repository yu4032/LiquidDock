name: Diagnose R8 release retention

on:
  push:
    branches: [ fix-r8-xposed-release-keep ]
    paths:
      - .github/workflows/r8-release-diagnostic-once.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate throwaway release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore ci-release.keystore -storepass changeit -keypass changeit -alias liquiddock -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI,O=LiquidDock,C=US'
          cat > keystore.properties <<'EOF'
          storeFile=ci-release.keystore
          storePassword=changeit
          keyAlias=liquiddock
          keyPassword=changeit
          EOF
      - name: Build optimized release
        run: ./gradlew assembleRelease --stacktrace
      - name: Inspect R8 output
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find build/outputs/apk/release -name '*.apk' -type f | head -1)
          echo "APK=$APK"
          sha256sum "$APK"
          echo '=== Xposed entry ==='
          unzip -p "$APK" META-INF/xposed/java_init.list || true
          echo
          echo '=== Xposed scope ==='
          unzip -p "$APK" META-INF/xposed/scope.list || true
          echo
          echo '=== Mapping files ==='
          find build/outputs/mapping -maxdepth 3 -type f -print 2>/dev/null || true
          MAP=$(find build/outputs/mapping/release -name mapping.txt -type f 2>/dev/null | head -1 || true)
          if [ -n "$MAP" ]; then
            echo '=== Critical mapping ==='
            grep -E '^(com\.hellovoid\.liquiddock\.(ModuleMain|SystemUiKeyguardGoneSource|SystemUiKeyguardGonePolicy|SystemUiKeyguardGoneRuntime|LauncherGlassHomePresentationHook|HookUtil)) ->' "$MAP" || true
            echo '=== ModuleMain members ==='
            awk '/^com\.hellovoid\.liquiddock\.ModuleMain ->/{p=1;print;next} p&&/^[^ ]/{exit} p{print}' "$MAP" | head -80
          fi
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          echo '=== Critical DEX strings ==='
          strings /tmp/classes.dex | grep -E 'SystemUiKeyguardGone(Source|Policy)|ModuleMain|KeyguardTransitionRepositoryImpl|emitTransition|SYSTEMUI_LOCKSCREEN_GONE_FINISHED|com\.android\.systemui' | head -100 || true
