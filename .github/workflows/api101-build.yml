name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: api101-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # PR caches are isolated to refs/pull/*/merge, so let repeated pushes
          # to the same PR reuse branch-specific Gradle/build-cache state.
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
          # The default on-success cleanup starts an extra Gradle invocation and
          # costs ~20-30s on this project. Cache keys are immutable and the repo
          # is small enough that retaining prior entries is preferable here.
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
          if (( ${#files[@]} > 0 )) && grep -En '(^|[^A-Za-z0-9_])(ob|ja)\.[A-Za-z_$]|com\.miui\.dock\.sidebar\.[a-z](["$;.)]|$)|startsWith\("com\.miui\.dock\.sidebar\."' "${files[@]}"; then
            echo "Forbidden Security Center obfuscated-name dependency detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Package installable OS4 debug APK
        if: github.ref == 'refs/heads/liquiddock4' || github.head_ref == 'liquiddock4'
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION=28.2.13676358
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -d "$NDK" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
            [[ -n "$SDKMANAGER" ]] || { echo 'Android SDK manager unavailable' >&2; exit 1; }
            "$SDKMANAGER" --install "ndk;$NDK_VERSION" >/dev/null
          fi
          ANDROID_NDK_HOME="$NDK" bash os4/native/build.sh

          shopt -s nullglob
          APKS=(build/outputs/apk/debug/*.apk)
          [[ "${#APKS[@]}" -eq 1 ]] || { echo "Expected exactly one debug APK" >&2; exit 1; }
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          [[ -x "$TOOLS/apksigner" ]] || { echo "apksigner not found" >&2; exit 1; }
          "$TOOLS/apksigner" sign --help | grep -F -q -- '--alignment-preserved'
          python3 os4/tools/package_native.py \
            "${APKS[0]}" os4/out/libliquiddock4.so os4/out/LiquidDock4-unsigned.apk
          "$TOOLS/apksigner" sign \
            --ks signing/hellovoid-debug.keystore \
            --ks-key-alias hellovoid-debug \
            --ks-pass pass:hellovoid-debug \
            --key-pass pass:hellovoid-debug \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --alignment-preserved true \
            --out os4/out/LiquidDock4-fuxi-debug.apk \
            os4/out/LiquidDock4-unsigned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs os4/out/LiquidDock4-fuxi-debug.apk
          python3 os4/tools/verify_installer.py \
            os4/out/LiquidDock4-fuxi-debug.apk os4/out/libliquiddock4.so
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/liquiddock4' && github.head_ref != 'liquiddock4'
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/liquiddock4' || github.head_ref == 'liquiddock4'
        with:
          name: LiquidDock4-fuxi-debug-${{ github.sha }}
          path: os4/out/LiquidDock4-fuxi-debug.apk
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-build-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
