name: One-shot production source reader audit

on:
  push:
    branches:
      - refactor/pure-runtime-state-tests
    paths:
      - .github/workflows/one-shot-source-reader-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pure-runtime-state-tests
      - name: Enumerate production-source-reading tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('src/test/java')
          count = 0
          for path in sorted(root.rglob('*.java')):
              text = path.read_text(errors='replace')
              production_ref = any(token in text for token in (
                  'src/main/java', 'src/main/kotlin', 'src/main/AndroidManifest.xml',
                  'build.gradle', 'settings.gradle'))
              source_read = 'Files.readString(' in text or 'Files.readAllBytes(' in text
              if not (production_ref and source_read):
                  continue
              count += 1
              print(f'### {path.name}')
              for number, line in enumerate(text.splitlines(), 1):
                  stripped = line.strip()
                  if ('Files.read' in stripped or 'assert' in stripped or 'indexOf(' in stripped
                          or '.contains(' in stripped):
                      print(f'{number}: {stripped}')
          print(f'TOTAL_SOURCE_READERS={count}')
          PY
