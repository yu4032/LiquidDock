name: Diagnose R8 release retention

on:
  push:
    branches: [ fix-r8-xposed-release-keep ]
    paths:
      - .github/workflows/r8-release-diagnostic-once.yml
      - src/main/keepRules/**

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate throwaway release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore ci-release.keystore -storepass changeit -keypass changeit -alias liquiddock -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI,O=LiquidDock,C=US'
          cat > keystore.properties <<'EOF'
          storeFile=ci-release.keystore
          storePassword=changeit
          keyAlias=liquiddock
          keyPassword=changeit
          EOF
      - name: Build optimized release
        run: ./gradlew assembleRelease --stacktrace
      - name: Assert R8 timing boundary
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find build/outputs/apk/release -name '*.apk' -type f | head -1)
          MAP=$(find build/outputs/mapping/release -name mapping.txt -type f | head -1)
          echo "APK=$APK"
          sha256sum "$APK"

          test "$(unzip -p "$APK" META-INF/xposed/java_init.list | tr -d '\r\n')" = 'com.hellovoid.liquiddock.ModuleMain'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fx 'com.miui.home'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fx 'com.android.systemui'

          classes=(
            ModuleMain
            SystemUiKeyguardGoneSource
            SystemUiKeyguardGonePolicy
            SystemUiKeyguardGoneProtocol
            SystemUiKeyguardGoneRuntime
            SystemUiHomeTransitionSource
            SystemUiHomeTransitionProtocol
            SystemUiHomeTransitionRuntime
            SystemUiHomeTransitionTracker
            LauncherGlassHomePresentationHook
          )
          for cls in "${classes[@]}"; do
            fqcn="com.hellovoid.liquiddock.${cls}"
            echo "assert keep: $fqcn"
            grep -Fqx "$fqcn -> $fqcn:" "$MAP"
          done

          echo '=== Stable timing boundary mapping ==='
          for cls in "${classes[@]}"; do
            fqcn="com.hellovoid.liquiddock.${cls}"
            grep -F "$fqcn -> $fqcn:" "$MAP"
          done
