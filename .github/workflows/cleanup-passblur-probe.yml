name: Cleanup PassBlur probe

on:
  push:
    branches:
      - fix/live-workspace-passblur
    paths:
      - .github/workflows/cleanup-passblur-probe.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-workspace-passblur
          fetch-depth: 0
      - name: Remove temporary PassBlur probe instrumentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java')
          s = path.read_text()

          field_start = s.index('    // Temporary device probe: aggregate live PassBlur delivery without flooding logcat.\n')
          field_end_marker = '    // Semantic content token for a requested wallpaper refresh.\n'
          field_end = s.index(field_end_marker, field_start)
          s = s[:field_start] + s[field_end:]

          for needle in (
              '            recordPassBlurProbePreDraw();\n',
              '                recordPassBlurProbeConsumed();\n',
              '            recordPassBlurProbeFrame();\n',
          ):
              count = s.count(needle)
              assert count == 1, (needle, count)
              s = s.replace(needle, '', 1)

          armed = ('        probeLog("armed " + diagnosticSessionId()\n'
                   '                + " listener=renderHandler source=LauncherViewRoot-PassBlur");\n')
          assert s.count(armed) == 1, s.count(armed)
          s = s.replace(armed, '', 1)

          method_start = s.index('    private synchronized void recordPassBlurProbeFrame() {\n')
          method_end = s.index('    private void bindProducerWhenReady(int attempt) {\n', method_start)
          s = s[:method_start] + s[method_end:]

          for forbidden in ('PBProbe', 'passBlurProbe', 'recordPassBlurProbe', 'probeLog('):
              assert forbidden not in s, forbidden

          path.write_text(s)
          PY
          git rm .github/workflows/cleanup-passblur-probe.yml
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java
          git commit -m 'chore: remove temporary PassBlur probe logs'
          git push origin HEAD:fix/live-workspace-passblur
