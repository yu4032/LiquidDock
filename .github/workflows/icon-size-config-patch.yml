name: Icon size config patch

on:
  push:
    branches:
      - feature/launcher-icon-size
    paths:
      - .github/workflows/icon-size-config-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/launcher-icon-size
      - name: Patch typed config and runtime wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java",
              '''        public static final ConfigKey<Boolean> WIDGET_ADAPTATION = bool(
                  "grid_widget_adaptation", false, false, false, ConfigKey.ExportMode.ALWAYS);
          public static final ConfigKey<Boolean> MARGINS_DP = bool(''',
              '''        public static final ConfigKey<Boolean> WIDGET_ADAPTATION = bool(
                  "grid_widget_adaptation", false, false, false, ConfigKey.ExportMode.ALWAYS);
          public static final ConfigKey<Boolean> ICON_SIZE_ENABLED = bool(
                  "launcher_icon_size_enabled", false, false, false, ConfigKey.ExportMode.ALWAYS);
          public static final ConfigKey<Integer> ICON_SIZE_PERCENT = integer(
                  "launcher_icon_size_percent", 100, 100, 100, 80, 120,
                  ConfigKey.ExportMode.ALWAYS);
          public static final ConfigKey<Boolean> MARGINS_DP = bool('''
          )

          replace_once(
              "src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java",
              '''        final boolean enabled, widgetAdaptation, dp, offsets;
          final float landscapeHorizontal, landscapeTop, landscapeBottom, landscapeRowGap;''',
              '''        final boolean enabled, widgetAdaptation, iconSizeEnabled, dp, offsets;
          final int iconSizePercent;
          final float landscapeHorizontal, landscapeTop, landscapeBottom, landscapeRowGap;'''
          )
          replace_once(
              "src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java",
              '''            widgetAdaptation = c.b(ConfigSchema.Grid.WIDGET_ADAPTATION.name(),
                      ConfigSchema.Grid.WIDGET_ADAPTATION.runtimeFallback());
              dp = c.b(ConfigSchema.Grid.MARGINS_DP.name(),''',
              '''            widgetAdaptation = c.b(ConfigSchema.Grid.WIDGET_ADAPTATION.name(),
                      ConfigSchema.Grid.WIDGET_ADAPTATION.runtimeFallback());
              iconSizeEnabled = c.b(ConfigSchema.Grid.ICON_SIZE_ENABLED.name(),
                      ConfigSchema.Grid.ICON_SIZE_ENABLED.runtimeFallback());
              iconSizePercent = Math.max(LauncherIconSizePolicy.MIN_PERCENT,
                      Math.min(LauncherIconSizePolicy.MAX_PERCENT, c.i(
                              ConfigSchema.Grid.ICON_SIZE_PERCENT.name(),
                              ConfigSchema.Grid.ICON_SIZE_PERCENT.runtimeFallback())));
              dp = c.b(ConfigSchema.Grid.MARGINS_DP.name(),'''
          )

          replace_once(
              "src/main/java/com/hellovoid/liquiddock/ModuleMain.java",
              '''            DockMirrorShortcutHook.install(classLoader);
              DockNativeShadowBridge.install(classLoader, runtimeConfig.dock);
              new MainHook().install(classLoader);''',
              '''            DockMirrorShortcutHook.install(classLoader);
              DockNativeShadowBridge.install(classLoader, runtimeConfig.dock);
              LauncherIconSizeHook.install(classLoader,
                      runtimeConfig.enabled && runtimeConfig.grid.iconSizeEnabled,
                      runtimeConfig.grid.iconSizePercent);
              new MainHook().install(classLoader);'''
          )
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java \
                  src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java \
                  src/main/java/com/hellovoid/liquiddock/ModuleMain.java
          git diff --cached --check
          git commit -m "feat: wire launcher icon size config"
          git push origin HEAD:feature/launcher-icon-size
