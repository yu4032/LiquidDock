name: Task6 doc typo one-shot

on:
  push:
    branches:
      - refactor/technical-debt-cleanup-phase1
    paths:
      - '.github/workflows/task6-doc-typo-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/technical-debt-cleanup-phase1
          fetch-depth: 0
      - name: Fix exact documentation typo
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('ARCHITECTURE.md'); t=p.read_text(); assert t.count('使旧 pending fallback 失效［') == 1; p.write_text(t.replace('使旧 pending fallback 失效［', '使旧 pending fallback 失效；', 1))"
          git diff --check
      - name: Commit and self-delete
        shell: bash
        run: |
          rm .github/workflows/task6-doc-typo-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md .github/workflows/task6-doc-typo-one-shot.yml
          git commit -m 'docs: fix workstation ownership punctuation'
          git push origin HEAD:refactor/technical-debt-cleanup-phase1
