name: Dock producer probe D1 force update

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dock-producer-d1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never
      - run: chmod +x ./gradlew
      - name: Apply D1 force-update producer probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java')
          s = bridge.read_text()
          marker = '''    /** Workspace idle suspension and vendor-snapshot Dock suspension. */\n    static void pauseUpdates(Binding binding) {'''
          method = '''    /** D1 latency probe: resubmit the live-update flag on every existing UI pre-draw. */\n    static void forceLiveUpdate(Binding binding) {\n        if (binding == null) return;\n        setUpdatesEnabled(binding, true, true);\n    }\n\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'D1 bridge marker count={s.count(marker)}')
          s = s.replace(marker, method + marker, 1)
          bridge.write_text(s)

          view = Path('src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java')
          s = view.read_text()
          old = '''        ViewTreeObserver.OnPreDrawListener listener = () -> {\n            refreshProducerGeometryInPlace();\n            updateBackdropMapping();\n            return true;\n        };'''
          new = '''        ViewTreeObserver.OnPreDrawListener listener = () -> {\n            refreshProducerGeometryInPlace();\n            updateBackdropMapping();\n            Miuix307PassBlurBridge.forceLiveUpdate(binding);\n            return true;\n        };'''
          if s.count(old) != 1:
              raise SystemExit(f'D1 preDraw block count={s.count(old)}')
          s = s.replace(old, new, 1)
          view.write_text(s)
          PY
      - name: Audit D1 probe shape
        shell: bash
        run: |
          grep -n 'forceLiveUpdate(binding)' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurTextureView.java
          grep -n 'setUpdatesEnabled(binding, true, true)' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java
          if grep -q 'SetPassBlurSurface.*binding.producerSurface' src/main/java/com/hellovoid/liquiddock/Miuix307PassBlurBridge.java; then
            echo 'D1 unexpectedly reasserts producer Surface' >&2
            exit 1
          fi
      - name: Audit Security Center zero-copy constraints
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src/main/java/com/hellovoid/liquiddock/SecurityCenter*.java
            src/main/java/com/hellovoid/liquiddock/RootPassBlur*.java
          )
          if (( ${#files[@]} > 0 )) && grep -En 'ScreenCapture|Bitmap\.createBitmap|PixelCopy|postDelayed\(' "${files[@]}"; then
            echo "Forbidden Security Center/root PassBlur regression detected" >&2
            exit 1
          fi
      - name: Unit + debug assembly
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expD1-force-update-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-expD1-source
          path: |
            src/main/java/com/hellovoid/liquiddock
            src/test/java/com/hellovoid/liquiddock
            prismal/src/main/java/com/hellovoid/prismal
          if-no-files-found: error
          retention-days: 3
