name: temp drag source fix

on:
  push:
    branches:
      - fix/folder-drag-workspace-glass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/folder-drag-workspace-glass
          fetch-depth: 0
      - name: Patch LauncherGlassSession
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java')
          s=p.read_text()
          if 'freezeAfterNextFreshFrame()' not in s:
              s=s.replace('    private volatile boolean rotationSettlePending;\n', '    private volatile boolean rotationSettlePending;\n    private volatile boolean freezeAfterNextFreshFrame;\n',1)
              s=s.replace('    void requestSceneRedraw() {\n', '''    void freezeAfterNextFreshFrame() {\n        if (shuttingDown) return;\n        freezeAfterNextFreshFrame = true;\n        sourceBackend.setUpdatesEnabled(true, "launcher-drag-capture");\n        sourceBackend.requestFresh(sceneGeneration, true);\n    }\n\n    void requestSceneRedraw() {\n''',1)
              s=s.replace('            backdropPrepared = true;\n            renderOutputs(true, true);\n', '            backdropPrepared = true;\n            renderOutputs(true, true);\n            if (freezeAfterNextFreshFrame) {\n                freezeAfterNextFreshFrame = false;\n                sourceBackend.setUpdatesEnabled(false, "launcher-drag-frozen");\n            }\n',1)
              p.write_text(s)
          PY
      - name: Commit session patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java
          git commit -m 'fix: allow one-shot drag backdrop capture'
          git push origin HEAD:fix/folder-drag-workspace-glass
