name: Temporary launcher static glass migration

on:
  push:
    branches:
      - feat/folder-press-glow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/folder-press-glow
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply-launcher-icon-widget-glass.py
      - name: Remove one-shot migration files
        run: |
          rm -f tools/apply-launcher-icon-widget-glass.py
          rm -f .github/workflows/launcher-static-glass-migration-temp.yml
      - name: Commit production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add widget icon glass and correct surface alignment"
          git push origin HEAD:feat/folder-press-glow
