name: Temporary SystemUI restart UI cleanup

on:
  push:
    branches:
      - fix-glass-animation-performance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-glass-animation-performance
      - name: Remove obsolete SystemUI restart UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          compose_path = Path('src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt')
          compose = compose_path.read_text()
          button = '                    TextButton(text = stringResource(R.string.action_restart_system_ui), onClick = { activity.restartSystemUi() })\n'
          assert button in compose, 'SystemUI restart TextButton not found'
          compose_path.write_text(compose.replace(button, '', 1))

          activity_path = Path('src/main/java/com/hellovoid/liquiddock/SettingsActivity.java')
          activity = activity_path.read_text()
          start = activity.index('\n    void restartSystemUi() {')
          end = activity.index('\n    public static class SettingsFragment', start)
          activity_path.write_text(activity[:start] + '\n' + activity[end:])

          strings_path = Path('src/main/res/values/strings.xml')
          strings = strings_path.read_text()
          entry = '    <string name="action_restart_system_ui">Restart System UI</string>\n'
          assert entry in strings, 'SystemUI restart string not found'
          strings_path.write_text(strings.replace(entry, '', 1))

          Path('.github/workflows/temp-remove-systemui-restart-ui.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: remove obsolete SystemUI restart action"
          git push origin HEAD:fix-glass-animation-performance
