name: Glass scene implementation runner

on:
  push:
    branches:
      - feat/folder-press-glow
    paths:
      - ci/glass_scene_apply.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply glass scene architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/folder-press-glow
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply architecture patch
        run: python3 ci/glass_scene_apply.py
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main
          git diff --cached --check
          git commit -m 'feat: wire glass scene architecture'
          git push origin HEAD:feat/folder-press-glow
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-glass-scene-debug
          path: build/outputs/apk/debug/*.apk
          retention-days: 7
