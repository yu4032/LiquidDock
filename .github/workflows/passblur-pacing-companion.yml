name: PassBlur pacing companion

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'native/passblur-pacing/**'
      - '.github/workflows/passblur-pacing-companion.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate pacing companion
        shell: bash
        run: |
          set -euo pipefail
          root="native/passblur-pacing"
          test "$(tr -d '\r\n ' < "$root/interval_ms")" = "12"
          grep -F 'persist.sys.sf.draw.texture' "$root/post-fs-data.sh"
          grep -F 'resetprop -n' "$root/post-fs-data.sh"
          grep -F 'original_value' "$root/uninstall.sh"
          sh -n "$root/post-fs-data.sh"
          sh -n "$root/uninstall.sh"
          bash -n "$root/install-adb.sh"

      - name: Package pacing companion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          (
            cd native/passblur-pacing
            zip -9 -r ../../out/LiquidDock-PassBlur-Pacing-experimental.zip \
              module.prop interval_ms post-fs-data.sh uninstall.sh install-adb.sh README.md
          )
          sha256sum out/LiquidDock-PassBlur-Pacing-experimental.zip \
            > out/LiquidDock-PassBlur-Pacing-experimental.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-PassBlur-Pacing-bundle
          path: |
            out/LiquidDock-PassBlur-Pacing-experimental.zip
            out/LiquidDock-PassBlur-Pacing-experimental.zip.sha256
          if-no-files-found: error
          retention-days: 7
