name: Milestone2 task1 one-shot

on:
  push:
    branches:
      - port/os4-volumetric-edge-model
    paths:
      - .github/workflows/milestone2-task1-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/os4-volumetric-edge-model
          fetch-depth: 0
      - name: Apply exact renderer patch
        run: python3 scripts/milestone2_task1_patch.py
      - name: Commit production patch and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/milestone2_task1_patch.py
          rm .github/workflows/milestone2-task1-one-shot.yml
          git add prismal/src/main/java/com/hellovoid/prismal/PrismalRenderer.java scripts/milestone2_task1_patch.py .github/workflows/milestone2-task1-one-shot.yml
          git commit -m 'feat: bind OS4 prismal edge uniforms'
          git push origin HEAD:port/os4-volumetric-edge-model
